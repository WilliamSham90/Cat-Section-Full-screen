        // Where it would land: the same spot spawn() will put it.
        const p = toWorld(ev.clientX, ev.clientY), def = drag.def;
        const half = (def.look.crop[2] * sizeOf(def)) / 2;
        const at = stand({ half }, p.x, p.y, def.kind === 'cat' ? zoneAt(p) : 'room');
        markDrop(at.x, at.y, half);
      }
    }

    // Which area a cat dragged to world point p goes in.
    const zoneAt = p => (p.y >= yard.y0 - 24 ? 'yard' : 'room');

    function endDrag(ev) {
      if (ev.pointerId !== drag.id) return;
      removeEventListener('pointermove', onDragMove);
      removeEventListener('pointerup', endDrag);
      removeEventListener('pointercancel', endDrag);
      document.body.classList.remove('dragging');
      trashEl.classList.remove('armed');
      hideDrop();
      const { e, def, moved, ghost, homeX, homeY, homeZone } = drag;
      drag = null;
      ghost?.remove();
      const cancelled = ev.type === 'pointercancel';

      if (!moved) {
        if (e && !cancelled) e.kind === 'cat' ? openMenu(e) : clickItem(e);
        return;
      }
      if (def) {                                            // new thing from the bar
        if (!cancelled && isOver(sceneEl, ev)) {
          const p = toWorld(ev.clientX, ev.clientY);
          const zone = def.kind === 'cat' ? zoneAt(p) : 'room';   // only cats go out to play
          emote(spawn(def, p.x, p.y, { zone }), '✨');
        }
        return;
      }
      if (e.fixed) return;
      if (!cancelled && isOver(trashEl, ev)) {              // put it back while we ask
        Object.assign(e, { x: homeX, y: homeY, zone: homeZone });
        if (e.kind === 'cat') act(e, 'sit', 0.8);
        confirmDelete(e);
        return;
      }
      if (e.kind === 'cat') {
        if (e.zone !== homeZone) say(e, e.zone === 'yard' ? 'Wheee!' : 'Home!');
        act(e, 'sit', 0.8);
      }
    }

    // ------------------------------------------------------------------
    // Cat menu – click a cat to name it, see how it's doing and tell it
    // what to do. While it's open the cat sits and waits.
    // ------------------------------------------------------------------
    const catMenu = document.getElementById('cat-menu');
    const nameInput = document.getElementById('cat-name');
    let menuCat = null;
    let menuClock = 0;

    // Shown as "how good", so a full bar is a happy cat.
    const NEED_BARS = [
      { need: 'hunger', label: 'Full', colour: '#e9a46a' },
      { need: 'tired', label: 'Energy', colour: '#8fb8d8' },
      { need: 'bored', label: 'Fun', colour: '#e8c66a' },
      { need: 'lonely', label: 'Love', colour: '#e89a9a' },
    ];
    const uiIcon = src => Object.assign(document.createElement('img'), { src, alt: '' });
    const frameIcon = (cat, anim) => thumb({ look: cat.def.anim[anim] ?? cat.def.anim.idle }, fitScale({ look: cat.def.anim[anim] ?? cat.def.anim.idle }, 28));
    const MENU_ACTIONS = [
      { label: 'Pet', icon: () => uiIcon('assets/ui/paw.png'), run: pet },
      { label: 'Feed', icon: () => uiIcon('assets/ui/fish.png'), run: cat => pursue(cat, 'hunger', true) || (say(cat, 'No food?'), act(cat, 'sit', 2)) },
      { label: 'Play', icon: () => thumb(CATALOG.find(d => d.name === 'Blue ball'), 2), run: cat => pursue(cat, 'bored') || zoomies(cat) },
      { label: 'Nap', icon: () => uiIcon('assets/ui/sleeping-cat.png'), run: cat => pursue(cat, 'tired') },
      { label: 'Sit', icon: cat => frameIcon(cat, 'sit'), run: cat => act(cat, 'sit', rand(4, 6)) },
      { label: 'Zoomies', icon: cat => frameIcon(cat, 'run'), run: zoomies },
    ];

    function buildNeeds() {
      document.getElementById('cat-needs').replaceChildren(...NEED_BARS.flatMap(({ label, colour }) => {
        const name = Object.assign(document.createElement('span'), { textContent: label });
        const bar = document.createElement('span');
        bar.className = 'meter';
        bar.setAttribute('role', 'meter');
        bar.setAttribute('aria-label', label);
        bar.setAttribute('aria-valuemin', '0');
        bar.setAttribute('aria-valuemax', '100');
        bar.style.setProperty('--fill', colour);
        bar.appendChild(document.createElement('span'));
        return [name, bar];
      }));
    }

    function showNeeds(cat) {
      const bars = document.querySelectorAll('#cat-needs .meter');
      NEED_BARS.forEach(({ need }, i) => {
        const value = Math.round((1 - cat.needs[need]) * 100);
        bars[i].setAttribute('aria-valuenow', String(value));
        bars[i].firstChild.style.width = `${value}%`;
      });
    }

    function openMenu(cat) {
      menuCat = cat;
      settle(cat);
      act(cat, 'sit', Infinity);
      cat.waiting = true;
      say(cat, 'Mew?');
      nameInput.value = cat.name;
      catMenu.setAttribute('aria-label', cat.name);
      document.getElementById('cat-actions').replaceChildren(...MENU_ACTIONS.map(({ label, icon, run }) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tile';
        b.append(icon(cat), label);
        b.addEventListener('click', () => {
          cat.waiting = false;
          catMenu.hidePopover();
          if (!cat.dead) { settle(cat); run(cat); }
        });
        return b;
      }));
      showNeeds(cat);
      catMenu.showPopover();
      placeMenu();
      catMenu.querySelector('.cat-actions button').focus({ preventScroll: true });
    }

    // Beside the cat, flipped to the other side or nudged in if it would
    // run off the screen.
    function placeMenu() {
      const cat = menuCat, box = app.canvas.getBoundingClientRect();
      const w = catMenu.offsetWidth, h = catMenu.offsetHeight;
      let left = box.left + cat.x + cat.half + 12;
      if (left + w > innerWidth - 8) left = box.left + cat.x - cat.half - 12 - w;
      const top = box.top + cat.y - cat.tall / 2 - h / 2;
      catMenu.style.left = `${clampTo(left, 8, Math.max(8, innerWidth - w - 8))}px`;
      catMenu.style.top = `${clampTo(top, 8, Math.max(8, innerHeight - h - 8))}px`;
    }

    function updateMenu(dt) {
      if (!menuCat) return;
      placeMenu();
      if ((menuClock -= dt) <= 0) { menuClock = 0.25; showNeeds(menuCat); }
    }

    function setupMenu() {
      buildNeeds();
      nameInput.addEventListener('input', () => {
        const name = nameInput.value.trim();
        if (!menuCat || !name) return;
        rename(menuCat, name);
        catMenu.setAttribute('aria-label', name);
      });
      nameInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') catMenu.hidePopover(); });
      // Closing without picking an action (Esc, clicking elsewhere): the cat carries on.
      catMenu.addEventListener('toggle', ev => {
        if (ev.newState !== 'closed' || !menuCat) return;
        const cat = menuCat;
        menuCat = null;
        if (cat.waiting && !cat.dead) { cat.waiting = false; think(cat); }
      });
    }

    // ------------------------------------------------------------------
    // Dialogs
    // ------------------------------------------------------------------
    // Open a modal <dialog>; resolves with the value of the button that
    // closed it, or '' for Esc.
    function showDialog(d) {
      d.returnValue = '';
      d.showModal();
      return new Promise(resolve => d.addEventListener('close', () => resolve(d.returnValue), { once: true }));
    }

    // Yes/no question; `text` is a list of strings and elements. Resolves true for yes.
    async function ask({ pic = null, text, yes, no }) {
      document.getElementById('confirm-pic').replaceChildren(...(pic ? [pic] : []));
      document.getElementById('confirm-text').replaceChildren(...text);
      document.getElementById('confirm-yes').textContent = yes;
      document.getElementById('confirm-no').textContent = no;
      return (await showDialog(confirmDialog)) === 'ok';
    }

    async function confirmDelete(e) {
      const name = Object.assign(document.createElement('strong'), { textContent: e.def.name });
      const yes = await ask({ pic: thumb(e.def, fitScale(e.def, 64)), text: ['Delete ', name, ' from the room?'],
                              yes: 'Delete', no: 'Keep it' });
      if (yes) remove(e);
    }

    async function confirmReset() {
      const yes = await ask({ text: ['Reset the room? Everything goes back to how it was at the start.'],
                              yes: 'Reset', no: 'Cancel' });
      if (yes) reset();
    }

    // ------------------------------------------------------------------
    // Room type and reset
    // ------------------------------------------------------------------
    let roomType = -1;

    function setRoom(i) {
      if (i === roomType) return;
      roomType = i;
      const picture = buildRoom(i);
      const old = room.texture;
      room.texture = PIXI.Texture.from(picture, true);
      if (old !== PIXI.Texture.EMPTY) old.destroy(true);
      document.getElementById('room-pic').replaceChildren(roomThumb(picture, 32));
    }

    // Open a picker dialog. `options` is a function returning
    // [{ value, label, pic }], called the first time only. Resolves with the
    // chosen value as a string, or null if it was closed without a choice.
    async function choose(dialog, grid, options, current) {
      if (!grid.children.length) {
        for (const { value, label, pic } of options()) {
          const b = document.createElement('button');
          b.className = 'tile';
          b.value = value;                                  // closes the dialog with this value
          b.append(pic, label);
          grid.appendChild(b);
        }
      }
      for (const b of grid.children) b.setAttribute('aria-current', String(b.value === String(current)));
      const choice = await showDialog(dialog);
      return choice === '' ? null : choice;
    }

    async function pickRoom() {
      const choice = await choose(roomsDialog, roomGrid, () => ROOM_TYPES.map(({ name }, i) =>
        ({ value: i, label: `${name} room`, pic: roomThumb(buildRoom(i), 64) })), roomType);
      if (choice !== null) setRoom(Number(choice));
    }

    // ------------------------------------------------------------------
    // Sky
    // ------------------------------------------------------------------
    let skyChoice = DEFAULT_SKY;                          // an index into SKIES, 'clock' or 'dark'

    const clockSky = (now = new Date()) => {
      const hour = now.getHours() + now.getMinutes() / 60;
      return SKIES.findLast(sky => hour >= sky.from) ?? SKIES.at(-1);   // before 4am: still night
    };
    const currentSky = now => skyChoice === 'clock' ? clockSky(now) : skyChoice === 'dark' ? DARK_SKY : SKIES[skyChoice];

    function skyThumb(src) {
      const pic = document.createElement('span');
      pic.className = 'sky-thumb';
      if (src) pic.style.backgroundImage = `url("${src}")`;
      return pic;
    }

    // Show the chosen sky; with 'clock' this is re-run every minute.
    function updateSky(now = new Date()) {
      const { src, stars, light } = currentSky(now);
      if (sceneEl.dataset.sky === src) return;
      sceneEl.dataset.sky = src;
      sceneEl.style.backgroundImage = src ? `url("${src}")` : 'none';
      document.getElementById('sky-pic').replaceChildren(skyThumb(src));
      setStars(stars);
      setLight(light);
    }

    // The light through the windows for this sky: a faint beam from each
    // sill and a brighter patch on the floor, brightest in the middle.
    function setLight(light) {
      windowLight.clear();
      if (!light) return;
      const [color, strength] = light;
      const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      const centre = pts => [pts.reduce((n, p) => n + p[0], 0) / pts.length, pts.reduce((n, p) => n + p[1], 0) / pts.length];
      for (const { sill, patch, stripes } of WINDOW_LIGHT) {
        const [a, b, c, d] = patch;
        windowLight.poly([...sill[0], ...sill[1], ...c, ...d]).fill({ color, alpha: strength * 0.35 });
        if (stripes) {                                   // light between the slats
          for (let i = 0; i < stripes; i++) {
            const t0 = i / stripes, t1 = (i + 0.55) / stripes;
            windowLight.poly([...mix(a, d, t0), ...mix(b, c, t0), ...mix(b, c, t1), ...mix(a, d, t1)]).fill({ color, alpha: strength });
          }
        } else {
          const mid = centre(patch);
          windowLight.poly(patch.flat()).fill({ color, alpha: strength })
            .poly(patch.flatMap(p => mix(mid, p, 0.7))).fill({ color, alpha: strength * 0.6 });
        }
      }
    }

    // ------------------------------------------------------------------
    // Stars – twinkling pixel stars and the odd shooting star, drawn behind
    // the room on the starry skies. Held still for people who ask their
    // system for reduced motion.
    // ------------------------------------------------------------------
    const STARS = {
      perArea: 1 / 9000,          // stars per px² of sky, at full starriness
      colours: [0xfffbe8, 0xfff1b8, 0xd8ecff],
      shootEvery: [5, 12],        // seconds between shooting stars
    };
    // A 4-point sparkle and a single dot, in 2px pixels.
    const SPARKLE = new PIXI.GraphicsContext()
      .rect(-1, -1, 2, 2).rect(-1, -3, 2, 2).rect(-1, 1, 2, 2).rect(-3, -1, 2, 2).rect(1, -1, 2, 2).fill(0xffffff);
    const DOT = new PIXI.GraphicsContext().rect(-1, -1, 2, 2).fill(0xffffff);
    const stillSky = matchMedia('(prefers-reduced-motion: reduce)');
    let starriness = 0;
    let starClock = 0;
    let nextShot = rand(...STARS.shootEvery);
    let shot = null;                                      // the shooting star in flight

    function setStars(amount) {
      starriness = amount;
      makeStars();
    }

    // Scatter stars over the sky; sunsets only get them high up.
    function makeStars() {
      for (const star of starLayer.removeChildren()) star.destroy();
      if (!starriness) return;
      const { width } = app.screen;
      const height = yard.y0 - 24;                        // the sky ends at the play area
      const top = starriness < 1 ? 0.5 : 1;               // share of the sky they reach down to
      const count = Math.round(width * height * top * STARS.perArea * starriness);
      for (let i = 0; i < count; i++) {
        const big = Math.random() < 0.3;
        const star = new PIXI.Graphics(big ? SPARKLE : DOT);
        star.position.set(Math.round(rand(0, width)), Math.round(rand(0, height * top)));
        star.scale.set(big && Math.random() < 0.4 ? 2 : 1);
        star.tint = pick(STARS.colours);
        Object.assign(star, { phase: rand(0, Math.PI * 2), speed: rand(1.2, 3.2), dim: rand(0.15, 0.45) });
        starLayer.addChild(star);
      }
    }

    function updateStars(dt) {
      starClock += dt;
      const still = stillSky.matches;
      for (const star of starLayer.children) {
        star.alpha = still ? 0.8 : star.dim + (1 - star.dim) * (0.5 + 0.5 * Math.sin(starClock * star.speed + star.phase));
      }
      shooter.clear();
      if (!starriness || still) return;
      if (!shot && (nextShot -= dt) <= 0) {
        const { width, height } = app.screen;
        const dir = Math.random() < 0.5 ? 1 : -1;
        shot = { x: rand(width * 0.2, width * 0.8), y: rand(0, height * 0.25), vx: dir * rand(500, 750), vy: rand(180, 280), age: 0, life: rand(0.6, 0.9) };
        nextShot = rand(...STARS.shootEvery);
      }
      if (!shot) return;
      shot.age += dt;
      shot.x += shot.vx * dt;
      shot.y += shot.vy * dt;
      const fade = 1 - shot.age / shot.life;
      if (fade <= 0) { shot = null; return; }
      // A head and a tail of 2px squares getting fainter.
      for (let i = 0; i < 12; i++) {
        shooter.rect(Math.round(shot.x - shot.vx * i * 0.012), Math.round(shot.y - shot.vy * i * 0.012), 2, 2)
          .fill({ color: 0xfffbe8, alpha: fade * (1 - i / 12) });
      }
    }

    function setSky(choice) {
      skyChoice = choice;
      updateSky();
    }

    async function pickSky() {
      const choice = await choose(skiesDialog, skyGrid, () => [
        { value: 'clock', label: 'Follow the clock', pic: skyThumb(clockSky().src) },
        ...SKIES.map(({ name, src }, i) => ({ value: i, label: name, pic: skyThumb(src) })),
        { value: 'dark', label: 'Dark', pic: skyThumb('') },
      ], skyChoice);
      if (choice !== null) setSky(/^\d+$/.test(choice) ? Number(choice) : choice);
    }

    function populate() {
      const f = floorBox();
      catsArrived = 0;
      for (const [name, fx, fy] of START) {
        spawn(CATALOG.find(d => d.name === name), f.x + (fx * 2 - 1) * f.rx, f.y + (fy * 2 - 1) * f.ry);
      }
      for (const def of SCENERY) spawn(def, yard.x0, yard.y1, { zone: 'yard', fixed: true });
      placeScenery();
    }

    // Back to the starting room: default room type, starting cats and things.
    function reset() {
      if (drag) endDrag({ pointerId: drag.id, type: 'pointercancel' });
      if (menuCat) catMenu.hidePopover();
      for (const e of entities) {
        e.dead = true;
        unlink(e);
      }
      entities.length = 0;
      for (const child of [...fx.removeChildren(), ...talk.removeChildren()]) child.destroy({ children: true });   // pop-ups, effects, bubbles
      emotes.length = 0;
      setRoom(DEFAULT_ROOM);
      setSky(DEFAULT_SKY);
      populate();
      const f = floorBox();
      effectAt('party', f.x, f.y);
    }

    // ------------------------------------------------------------------
    // Control bar
    // ------------------------------------------------------------------
    const SIGN = { closed: 'assets/ui/icon-plus.png', open: 'assets/ui/icon-minus.png' };

    // A button that opens and closes a group of items.
    function makeToggle(name, label, def) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'toggle tile';
      button.setAttribute('aria-label', name);
      if (def) button.appendChild(thumb(def, fitScale(def, 28)));
      const text = Object.assign(document.createElement('span'), { className: 'label', textContent: label });
      const sign = Object.assign(document.createElement('img'), { className: 'sign', src: SIGN.closed, alt: '' });
      button.append(text, sign);
      return button;
    }

    // Each group of items sits behind its own button: + opens it, − closes
    // it. Opening one group closes the others; "All" opens or closes them all.
    function buildPalette() {
      const groups = [];
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const setOpen = (g, open) => {
        g.row.hidden = !open;
        g.toggle.setAttribute('aria-expanded', String(open));
        g.toggle.querySelector('.sign').src = open ? SIGN.open : SIGN.closed;
      };
      const allButton = makeToggle('All items', 'All', null);
      const syncAll = () => {
        const open = groups.every(g => !g.row.hidden);
        allButton.setAttribute('aria-expanded', String(open));
        allButton.querySelector('.sign').src = open ? SIGN.open : SIGN.closed;
      };
      paletteEl.appendChild(allButton);

      for (const [group, defs] of Map.groupBy(CATALOG, d => d.group)) {
        const section = document.createElement('section');
        section.className = 'group';
        const row = document.createElement('div');
        row.id = `group-${group.toLowerCase()}`;
        const toggle = makeToggle(group, group, defs[0]);
        toggle.setAttribute('aria-controls', row.id);
        section.append(toggle, row);
        const g = { toggle, row };
        groups.push(g);

        toggle.addEventListener('click', () => {
          const open = row.hidden;
          for (const other of groups) setOpen(other, open && other === g);
          syncAll();
          if (open) {                                      // bring the opened group into view
            const left = section.getBoundingClientRect().left - paletteEl.getBoundingClientRect().left;
            paletteEl.scrollTo({ left: paletteEl.scrollLeft + left - 8, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
          }
        });

        for (const def of defs) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'item tile';
          button.title = `${def.name} – drag into the scene, or click to add`;
          button.setAttribute('aria-label', `Add ${def.name}`);
          button.appendChild(thumb(def, fitScale(def, 40)));
          button.addEventListener('pointerdown', ev => startDrag({ def }, ev));
          button.addEventListener('click', ev => {
            if (ev.detail && dragMoved) return;              // this click just ended a drag
            const at = randomSpot();
            emote(spawn(def, at.x, at.y), '✨');
          });
          row.appendChild(button);
        }
        paletteEl.appendChild(section);
      }

      allButton.setAttribute('aria-controls', groups.map(g => g.row.id).join(' '));
      allButton.addEventListener('click', () => {
        const open = groups.some(g => g.row.hidden);
        for (const g of groups) setOpen(g, open);
        syncAll();
      });
      groups.forEach((g, i) => setOpen(g, i === 0));       // start with the cats showing
      syncAll();
      // Mouse wheel scrolls the bar sideways.
      paletteEl.addEventListener('wheel', ev => {
        if (ev.deltaX || !ev.deltaY) return;
        paletteEl.scrollLeft += ev.deltaY;
        ev.preventDefault();
      }, { passive: false });
    }

    // ------------------------------------------------------------------
    // Sound – background music and cat sounds, each with its own on/off and
    // volume, remembered in this browser. Files come from tools/build_audio.py.
    // Everything runs through one AudioContext, started on the first click
    // or key press as browsers require; that also makes volume work on
    // iPhones, where <audio>.volume is ignored. Music starts off.
    // ------------------------------------------------------------------
    const SONGS = [
      { id: 'forgotten-biomes', title: 'Forgotten Biomes' },
      { id: 'polar-lights', title: 'Polar Lights' },
      { id: 'sunlight-through-leaves', title: 'Sunlight Through Leaves' },
      { id: 'what-clouds-are-made-of', title: 'What Clouds Are Made Of' },
    ];
    const SOUNDS = ['meow1', 'meow2', 'meow3', 'meow4', 'hiss', 'purr', 'scratch'];
    const MUSIC_MAX = 0.45;                               // full slider = this gain: music stays in the background
    const CATS_MAX = 0.9;
    const SOUND_KEY = 'cat-room-sound';
    const sound = { music: false, song: SONGS[0].id, musicVolume: 0.5, cats: true, catsVolume: 0.2 };
    let audio = null;                                     // { ctx, music, cats, player, buffers } once started
    let lastMeow = 0;

    function loadSoundSettings() {
      try { Object.assign(sound, JSON.parse(localStorage.getItem(SOUND_KEY)) ?? {}); } catch { /* private mode etc. */ }
      if (!SONGS.some(song => song.id === sound.song)) sound.song = SONGS[0].id;
    }
    function saveSoundSettings() {
      try { localStorage.setItem(SOUND_KEY, JSON.stringify(sound)); } catch { /* not saved, still works */ }
    }

    // Ease a gain to `value` instead of jumping, so nothing clicks or blasts.
    function glide(gain, value, seconds = 0.4) {
      const t = audio.ctx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(value, t + seconds);
    }

    function startAudio() {
      if (audio) return audio.ctx.resume();
      const ctx = new AudioContext();
      const music = ctx.createGain();
      const cats = ctx.createGain();
      music.gain.value = 0;
      cats.gain.value = sound.cats ? sound.catsVolume * CATS_MAX : 0;
      music.connect(ctx.destination);
      cats.connect(ctx.destination);
      const player = new Audio();
      player.preload = 'none';                          // songs download only when played
      player.loop = true;
      ctx.createMediaElementSource(player).connect(music);
      audio = { ctx, music, cats, player, buffers: new Map() };
      for (const name of SOUNDS) {
        fetch(`assets/audio/sfx/${name}.mp3`).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b))
          .then(buffer => audio.buffers.set(name, buffer)).catch(() => {});
      }
      if (sound.music) playMusic();
    }

    function playMusic() {
      if (!audio || document.hidden) return;
      const { player } = audio;
      const src = `assets/audio/music/${sound.song}.mp3`;
      if (!player.src.endsWith(src)) player.src = src;
      player.play().then(() => glide(audio.music, sound.musicVolume * MUSIC_MAX, 2)).catch(() => {});
    }
    function pauseMusic() {
      if (!audio) return;
      glide(audio.music, 0, 0.5);
      setTimeout(() => { if (!sound.music || document.hidden) audio.player.pause(); }, 550);
    }
    function changeSong(id) {
      sound.song = id;
      if (!audio || !sound.music) return;
      glide(audio.music, 0, 0.4);
      setTimeout(() => { audio.player.src = `assets/audio/music/${id}.mp3`; playMusic(); }, 450);
    }

    // Play a cat sound. `rate` shifts the pitch (each cat has its own voice),
    // `pan` places it left/right, `length` cuts long sounds short with a fade.
    function playSound(name, { rate = 1, pan = 0, length = 0 } = {}) {
      if (!audio || !sound.cats || audio.ctx.state !== 'running') return;
      const buffer = audio.buffers.get(name);
      if (!buffer) return;
      const { ctx } = audio, t = ctx.currentTime;
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = rate;
      const fade = ctx.createGain();
      const panner = ctx.createStereoPanner();
      panner.pan.value = clampTo(pan, -1, 1);
      source.connect(fade).connect(panner).connect(audio.cats);
      source.start(t);
      if (length) {
        fade.gain.setValueAtTime(1, t + Math.max(0, length - 0.8));
        fade.gain.linearRampToValueAtTime(0, t + length);
        source.stop(t + length);
      }
    }

    // A cat's sound for something it says, from roughly where it is.
    function voice(cat, text) {
      const pan = (cat.x / app.screen.width) * 1.2 - 0.6;
      if (text === 'Hiss!') return playSound('hiss', { rate: cat.voice, pan });
      if (text === 'Purr~') return playSound('purr', { rate: cat.voice, pan, length: 2.6 });
      const now = performance.now();
      if (now - lastMeow < 400) return;                   // a room full of cats shouldn't be a wall of meows
      lastMeow = now;
      playSound(pick(['meow1', 'meow2', 'meow3', 'meow4']), { rate: cat.voice, pan });
    }

    // ---- The sound menu ----
    const soundMenu = document.getElementById('sound-menu');
    const soundButton = document.getElementById('sound-button');

    function showSoundSettings() {
      const set = (id, on) => {
        const b = document.getElementById(id);
        b.setAttribute('aria-pressed', String(on));
        b.textContent = on ? 'On' : 'Off';
      };
      set('music-toggle', sound.music);
      set('cats-toggle', sound.cats);
      document.getElementById('music-volume').value = Math.round(sound.musicVolume * 100);
      document.getElementById('cats-volume').value = Math.round(sound.catsVolume * 100);
      for (const input of document.querySelectorAll('#tracks input')) input.checked = input.value === sound.song;
      soundButton.dataset.music = sound.music ? 'on' : 'off';
    }

    function setMusic(on) {
      sound.music = on;
      startAudio();
      on ? playMusic() : pauseMusic();
    }

    function placeSoundMenu() {
      const r = soundButton.getBoundingClientRect(), w = soundMenu.offsetWidth;
      soundMenu.style.left = `${clampTo(r.right - w, 8, innerWidth - w - 8)}px`;
      soundMenu.style.top = `${r.bottom + 8}px`;
    }

    function setupSound() {
      loadSoundSettings();
      document.getElementById('tracks').append(...SONGS.map(({ id, title }) => {
        const label = document.createElement('label');
        label.className = 'tile';
        const input = Object.assign(document.createElement('input'), { type: 'radio', name: 'song', value: id });
        label.append(input, title);
        return label;
      }));
      showSoundSettings();
      const changed = () => { saveSoundSettings(); showSoundSettings(); };

      soundMenu.addEventListener('toggle', ev => { if (ev.newState === 'open') { showSoundSettings(); placeSoundMenu(); } });
      addEventListener('resize', () => { if (soundMenu.matches(':popover-open')) placeSoundMenu(); });

      document.getElementById('music-toggle').addEventListener('click', () => { setMusic(!sound.music); changed(); });
      document.getElementById('tracks').addEventListener('change', ev => {
        changeSong(ev.target.value);
        if (!sound.music) setMusic(true);                 // picking a song means "play it"
        changed();
      });
      document.getElementById('music-volume').addEventListener('input', ev => {
        sound.musicVolume = ev.target.value / 100;
        if (audio && sound.music) glide(audio.music, sound.musicVolume * MUSIC_MAX, 0.1);
        saveSoundSettings();
      });
      document.getElementById('cats-toggle').addEventListener('click', () => {
        sound.cats = !sound.cats;
        startAudio();
        glide(audio.cats, sound.cats ? sound.catsVolume * CATS_MAX : 0, 0.2);
        changed();
      });
      document.getElementById('cats-volume').addEventListener('input', ev => {
        sound.catsVolume = ev.target.value / 100;
        if (audio && sound.cats) glide(audio.cats, sound.catsVolume * CATS_MAX, 0.1);
        saveSoundSettings();
      });

      // Browsers only allow sound after the visitor does something, and for
      // touch that's the finger lifting, not landing. Keep trying on each of
      // these until the audio is actually running.
      const UNLOCK_EVENTS = ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'];
      const unlock = () => {
        startAudio();
        if (audio?.ctx.state === 'running') return done();
        audio?.ctx.addEventListener('statechange', () => { if (audio.ctx.state === 'running') done(); }, { once: true });
      };
      const done = () => { for (const type of UNLOCK_EVENTS) removeEventListener(type, unlock, true); };
      for (const type of UNLOCK_EVENTS) addEventListener(type, unlock, { capture: true, passive: true });
      // Quiet while the tab is hidden; carry on when it's back.
      document.addEventListener('visibilitychange', () => {
        if (!audio || !sound.music) return;
        document.hidden ? pauseMusic() : playMusic();
      });
    }

    // ------------------------------------------------------------------
    // Main
    // ------------------------------------------------------------------
    function start() {
      buildPalette();
      setupMenu();
      setupSound();
      updateSky();
      setInterval(updateSky, 60_000);
      setRoom(DEFAULT_ROOM);
      layout();
      populate();

      app.renderer.on('resize', layout);
      document.getElementById('room-button').addEventListener('click', pickRoom);
      document.getElementById('sky-button').addEventListener('click', pickSky);
      document.getElementById('reset').addEventListener('click', confirmReset);

      // Frame-rate independent via deltaMS; capped so a hidden tab doesn't teleport things.
      app.ticker.add(({ deltaMS }) => {
        const dt = Math.min(deltaMS / 1000, 0.1);
        for (const e of [...entities]) if (!e.dead && !held(e)) UPDATE[e.kind]?.(e, dt);
        for (const e of entities) draw(e);
        updateEmotes(dt);
        updateBubbles(dt);
        updateStars(dt);
        updateMenu(dt);
      });
    }

    loadArt().then(start, showError);
  </script>
</body>
</html>
