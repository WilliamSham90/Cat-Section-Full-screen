<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cat Playground</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b1b24;
      --bar: #23232f;
      --edge: #363649;
      --slot: #2d2d3d;
      --slot-hover: #3b3b52;
      --text: #f2f2f7;
      --muted: #9a9ab0;
      --focus: #8ab4ff;
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: minmax(0, 1fr);
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, sans-serif;
    }

    /* ---- Control bar: everything you can add, plus the trash ---- */
    .bar {
      display: flex;
      gap: 12px;
      padding: 8px 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--edge);
    }
    .palette {
      flex: 1;
      min-width: 0;                   /* let it scroll instead of widening the page */
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }
    .group, .group > div { display: flex; gap: 6px; }
    .group > div[hidden] { display: none; }

    /* A group's button: picture, name, and + (closed) or − (open). */
    .toggle {
      flex: none;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px 0 8px;
      background: var(--slot);
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font: 600 12px/1 system-ui, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    .toggle:hover { background: var(--slot-hover); }
    .toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .toggle[aria-expanded="true"] { border-color: var(--focus); }
    .toggle canvas { image-rendering: pixelated; pointer-events: none; }
    .toggle .sign { width: 12px; font-size: 18px; color: var(--muted); text-align: center; }
    .item {
      flex: none;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--slot);
      border: 0;
      border-radius: 10px;
      cursor: grab;
      touch-action: pan-x;            /* swipe sideways scrolls the bar, drag down places the item */
      user-select: none;
      -webkit-touch-callout: none;
    }
    .item:hover { background: var(--slot-hover); }
    .item:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .item canvas, .ghost, .pic canvas { image-rendering: pixelated; pointer-events: none; }

    .tools { flex: none; display: flex; gap: 8px; }
    .tool, .trash {
      flex: none;
      width: 72px;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 2px;
      border: 2px dashed var(--edge);
      border-radius: 12px;
      color: var(--muted);
      font-size: 11px;
      transition: background-color .15s, border-color .15s, color .15s, transform .15s;
    }
    .tool {
      padding: 4px;
      background: var(--slot);
      border-style: solid;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
    }
    .tool:hover { background: var(--slot-hover); }
    .tool:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tool canvas, .tool .sky-thumb { display: block; width: 32px; height: 28px; }
    .dragging .tool { pointer-events: none; }
    .dragging .trash { border-color: var(--muted); }
    .trash.armed {
      background: color-mix(in srgb, var(--danger) 18%, transparent);
      border-color: var(--danger);
      color: var(--danger);
      transform: scale(1.06);
    }

    /* ---- Scene: the room sits in the middle of this backdrop ---- */
    #scene {
      position: relative;
      min-height: 0;
      background: var(--bg) center / cover no-repeat;      /* the sky picture is set from the clock */
      image-rendering: pixelated;
      transition: background-image 1.5s;
    }
    #scene canvas { position: absolute; inset: 0; display: block; touch-action: none; }

    .ghost { position: fixed; left: 0; top: 0; z-index: 10; opacity: .85; }
    .dragging, .dragging * { cursor: grabbing !important; user-select: none; }

    /* ---- Delete confirmation ---- */
    dialog {
      width: min(320px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid var(--edge);
      border-radius: 14px;
      background: var(--bar);
      color: var(--text);
      text-align: center;
    }
    dialog::backdrop { background: rgb(0 0 0 / .55); }
    dialog p { margin: 8px 0 18px; font-size: 16px; }
    .pic { display: grid; place-items: center; min-height: 64px; }
    .pic:empty { display: none; }
    .actions { display: flex; justify-content: center; gap: 8px; }
    .actions button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--edge);
      background: var(--slot);
      color: var(--text);
      cursor: pointer;
    }
    .actions button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* ---- Room and sky pickers ---- */
    .picker { width: min(560px, calc(100vw - 32px)); }
    .picker h2 { margin: 0 0 14px; font-size: 16px; }
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .room-grid button {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 8px 4px 6px;
      border: 2px solid transparent;
      border-radius: 10px;
      background: var(--slot);
      color: var(--muted);
      font: 12px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    .room-grid button:hover { background: var(--slot-hover); color: var(--text); }
    .room-grid button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .room-grid button[aria-current="true"] { border-color: var(--focus); color: var(--text); }
    .room-grid canvas, .room-grid .sky-thumb { width: 64px; height: 56px; }
    .sky-thumb {
      border-radius: 6px;
      background: var(--bg) center / cover no-repeat;
      image-rendering: pixelated;
    }

    /* ---- Signature ---- */
    .signature {
      position: fixed;
      right: 12px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5;
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 0;
      padding: 4px 12px 6px;
      border-radius: 999px;
      background: rgb(27 27 36 / .6);
      color: var(--text);
      font-size: 11px;
      pointer-events: none;                 /* never gets in the way of dragging */
    }
    .signature .name {
      font: 20px/1 "Segoe Script", "Bradley Hand", "Snell Roundhand", "Brush Script MT", cursive;
    }

    @media (max-width: 600px) {
      .bar { gap: 8px; padding: 6px 8px; }
      .toggle { height: 44px; padding: 0 6px; }
      .toggle canvas + .label { display: none; }         /* the picture and aria-label name it */
      .item { width: 44px; height: 44px; }
      .tools { gap: 4px; }
      .tool, .trash { width: 50px; }
    }
  </style>
</head>
<body>
  <header class="bar" aria-label="Add cats and objects: open a group, then drag an item into the room or click it">
    <nav class="palette" id="palette" aria-label="Items"></nav>
    <div class="tools">
      <button type="button" class="tool" id="room-button" title="Choose a room" aria-haspopup="dialog">
        <span id="room-pic" aria-hidden="true"></span>
        Room
      </button>
      <button type="button" class="tool" id="sky-button" title="Choose the sky behind the room" aria-haspopup="dialog">
        <span id="sky-pic" aria-hidden="true"></span>
        Sky
      </button>
      <button type="button" class="tool" id="reset" title="Put the room back the way it started">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>
        </svg>
        Reset
      </button>
      <div class="trash" id="trash" title="Drag something here to delete it">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>
        </svg>
        Trash
      </div>
    </div>
  </header>
  <main id="scene"></main>
  <footer class="signature"><span>Made by</span> <span class="name">William Sham</span></footer>

  <dialog id="confirm" aria-labelledby="confirm-text">
    <form method="dialog">
      <div class="pic" id="confirm-pic"></div>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" id="confirm-no" autofocus></button>
        <button value="ok" id="confirm-yes" class="danger"></button>
      </div>
    </form>
  </dialog>

  <dialog id="rooms" class="picker" aria-labelledby="rooms-title">
    <form method="dialog">
      <h2 id="rooms-title">Choose a room</h2>
      <div class="room-grid" id="room-grid"></div>
      <div class="actions"><button value="">Close</button></div>
    </form>
  </dialog>

  <dialog id="skies" class="picker" aria-labelledby="skies-title">
    <form method="dialog">
      <h2 id="skies-title">Choose the sky</h2>
      <div class="room-grid" id="sky-grid"></div>
      <div class="actions"><button value="">Close</button></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
  <script type="module">
    // ------------------------------------------------------------------
    // Catalogue – every cat and object in the control bar
    // ------------------------------------------------------------------
    // `scale` is the on-screen pixel size on a desktop-width screen (halved on
    // phones). Cat 1 is drawn at twice the detail of the others, hence 2 vs 4.
    // Cat sheets are strips of square frames; the frame count comes from the
    // image size, so only the file names are listed here.
    const CATS = [
      { name: 'Cream cat', dir: 'Cat 1/', scale: 2,
        files: { idle: 'Idle', run: 'Running', sit: 'Chilling', sleep: 'Sleeping', jump: 'Jump', attack: 'Attack', happy: 'Happy' } },
      { name: 'Tiger cat', dir: 'TigerCat/', scale: 4,
        files: { idle: 'IdleCatt', run: 'RunCatt', sit: 'Sittingg', sleep: 'SleepCatt', jump: 'JumpCattt', attack: 'AttackCatt' } },
      { name: 'Batman cat', dir: 'BatmanCat/', scale: 4,
        files: { idle: 'IdleCatt', run: 'RunCatt', sit: 'Sittingg', sleep: 'SleepCatt', jump: 'JumpCattt', attack: 'AttackCatt' } },
      { name: 'Egyptian cat', dir: 'EgyptCat/', scale: 4,
        files: { idle: 'IdleCatb', run: 'RunCatb', sit: 'Sittingb', sleep: 'SleepCatb', jump: 'JumpCabt', attack: 'AttackCatb' } },
      { name: 'Siamese cat', dir: 'Siamese/', scale: 4,
        files: { idle: 'IdleCattt', run: 'RunCattt', sit: 'Sittinggg', sleep: 'SleepCattt', jump: 'JumpCatttt', attack: 'AttackCattt' } },
      { name: 'Calico cat', dir: 'ThreeColor/', scale: 4,
        files: { idle: 'IdleCatt', run: 'RunCatt', sit: 'Sittingg', sleep: 'SleepCatt', jump: 'JumpCattt', attack: 'AttackCatt' } },
      { name: 'Odd-eyed cat', dir: 'White-DifferentEyes/', scale: 4,
        files: { idle: 'IdleCatttt', run: 'RunCatttt', sit: 'Sittingggg', sleep: 'SleepCatttt', jump: 'JumpCattttt', attack: 'AttackCattt' } },
    ];

    // "frames per tick at 60 ticks/sec" (0.1 ≈ 6 fps)
    const ANIM_SPEED = { idle: 0.1, run: 0.22, sit: 0.07, sleep: 0.04, jump: 0.25, attack: 0.25, happy: 0.12 };

    // frame = [x, y, w, h] of the first frame; `frames` more follow every `stride` px.
    // kind = how cats use it (see USES below).
    const ITEM = 'sprite/CatItems/';
    const cells = (group, file, cols, size, names, props) => names.map((name, i) => ({
      group, name, src: ITEM + file, ...props,
      frame: [(i % cols) * size, Math.floor(i / cols) * size, size, size],
    }));
    // The room decorations sheet holds pictures of every size, so each one
    // is listed by name with its [x, y, w, h] on the sheet. Its pixels match
    // the room pictures, so scale 2 keeps them in proportion with the room.
    const DECOR = ITEM + 'Decorations/CatRoomDecorations.png';
    const decor = (group, props, list) => list.map(([name, frame]) => ({ group, name, src: DECOR, frame, scale: 2, ...props }));

    const ITEMS = [
      ...cells('Food', 'CatToys/CatBowls.png', 2, 16, ['Green bowl', 'Blue bowl', 'Purple bowl', 'Red bowl'], { kind: 'bowl', scale: 3 }),
      ...cells('Food', 'CatToys/fish.png', 2, 16, ['Blue fish', 'Orange fish', 'Silver fish', 'Yellow fish'], { kind: 'fish', scale: 3 }),
      ...cells('Food', 'CatToys/catfood.png', 1, 32, ['Bag of cat food'], { kind: 'bag', scale: 2 }),
      ...['Blue', 'Orange', 'Pink'].map(c => ({
        group: 'Toys', name: `${c} ball`, src: `${ITEM}CatToys/${c}Ball-Sheet.png`, kind: 'ball', scale: 4, frame: [0, 0, 24, 16] })),
      { group: 'Toys', name: 'Toy mouse', src: ITEM + 'CatToys/Mouse-Sheet.png', kind: 'mouse', scale: 2, frame: [0, 0, 32, 32], frames: 4, stride: 42 },
      { group: 'Toys', name: 'Feather wand', src: ITEM + 'CatToys/CatToy.png', kind: 'wand', scale: 3, frame: [0, 0, 32, 32], frames: 6 },
      ...['Blue', 'Brown', 'Green', 'Pink', 'Purple', 'Red'].flatMap(c =>
        cells('Beds', `Beds/CatBed${c}.png`, 1, 64, [`${c} bed`], { kind: 'bed', scale: 3, seat: 7 })),
      // `seat` = how far above its feet (in sheet pixels) a cat lies in the bed.
      ...decor('Beds', { kind: 'bed', seat: 24 }, [
        ['Blue cushion', [202, 138, 110, 82]], ['Grey cushion', [329, 138, 110, 82]],
        ['Red cushion', [202, 236, 110, 82]], ['Olive cushion', [329, 236, 110, 82]],
        ['Purple cushion', [202, 326, 110, 82]], ['Teal cushion', [329, 326, 110, 82]],
      ]),
      ...cells('Hideaways', 'Beds/CatHomes.png', 2, 63, ['Blue house', 'Green house', 'Purple house', 'Orange house'], { kind: 'hideout', scale: 3 }),
      ...cells('Hideaways', 'Beds/CatBoxes.png', 4, 64, ['Brown carrier', 'Purple carrier', 'Orange carrier', 'Red carrier',
        'Green carrier', 'Blue carrier', 'Black carrier', 'Navy carrier'], { kind: 'hideout', scale: 3 }),
      ...cells('Furniture', 'CatToys/toyss.png', 2, 64, ['Green scratcher', 'Blue scratcher', 'Purple scratcher', 'Red scratcher'], { kind: 'post', scale: 3 }),
      ...cells('Furniture', 'PlayGrounds/CatPlayGround.png', 1, 128, ['Cat tree'], { kind: 'tree', scale: 3 }),
      ...cells('Furniture', 'PlayGrounds/CatPlayGroundLighter.png', 1, 128, ['Light cat tree'], { kind: 'tree', scale: 3 }),
      ...decor('Furniture', { kind: 'post' }, [
        ['Peach scratching post', [191, 17, 64, 110]], ['Olive scratching post', [287, 16, 64, 110]],
        ['Slate scratching post', [383, 16, 64, 110]],
      ]),
      // Decor is just for looks: cats walk around it.
      ...decor('Decor', { kind: 'decor' }, [
        ['Fig in a brown pot', [140, 299, 45, 108]], ['Fig in a navy pot', [140, 421, 45, 108]],
        ['Fig in a pink pot', [138, 552, 45, 108]], ['Fig in a blue pot', [138, 685, 45, 108]],
        ['Pink pot plant', [132, 193, 23, 29]], ['Grey pot plant', [164, 193, 23, 29]],
        ['Cream pot plant', [132, 226, 23, 29]], ['Mint pot plant', [164, 226, 23, 29]],
        ['Yellow pot plant', [132, 258, 23, 29]], ['Blue pot plant', [164, 258, 23, 29]],
        ['Peach shelf', [14, 289, 100, 127]], ['Blue shelf', [12, 416, 100, 128]],
        ['Green shelf', [9, 544, 100, 128]], ['Purple shelf', [7, 673, 100, 127]],
        ['Wooden shelf', [7, 801, 100, 127]],
        ['Cream table', [674, 610, 61, 61]], ['Grey table', [738, 610, 61, 61]],
        ['Pink table', [802, 610, 61, 61]], ['Teal table', [866, 610, 61, 61]],
        ['Lilac table', [930, 610, 61, 61]],
      ]),
    ];
    const CATALOG = [...CATS.map(c => ({ ...c, group: 'Cats', kind: 'cat' })), ...ITEMS];

    // Platform tops on the cat tree sheet, in sheet pixels [x, y].
    const PERCHES = [[16, 40], [52, 52], [104, 24], [72, 84]];

    // ------------------------------------------------------------------
    // Room – one of the isometric room pictures, given a wooden floor and
    // decorated from the decorations sheet. The room types differ in wall
    // colour; each also picks its own curtains, blinds and portrait.
    // ------------------------------------------------------------------
    const ROOM_TYPES = ['Rose', 'Slate', 'Honey', 'Lilac', 'Sage', 'Teal', 'Pistachio', 'Stone',
      'Plum', 'Cocoa', 'Cloud', 'Sky', 'Periwinkle', 'Mint', 'Coral']
      .map((name, i) => ({ name, src: `${ITEM}Rooms/Room${i + 1}.png` }));
    const DEFAULT_ROOM = 0;

    // All room pictures share this layout, in picture pixels.
    const ROOM = {
      crop: [9, 27, 496, 436],                         // the opaque part of the picture
      floorSeed: [256, 330],                           // any pixel of the bare floor
      floor: { x: 262, y: 322, rx: 226, ry: 121 },     // floor diamond: centre and half-diagonals
      base: 2,                                         // catalogue scales assume the room drawn at 2×
    };

    // Hung on the walls: `at` is the top-left corner in picture pixels; room
    // type i uses frames[i % frames.length]. The sheet draws each piece for
    // one wall: curtains, the air vent and the painting face the left wall,
    // blinds and portraits the right.
    const WALL_DECOR = [
      { at: [70, 140], frames: [[674, 306, 93, 139], [770, 301, 93, 139], [866, 299, 93, 139]] },   // curtained window
      { at: [190, 130], frames: [[79, 226, 38, 62]] },                                                // painting
      { at: [285, 95], frames: [[864, 3, 64, 123], [928, 4, 64, 123], [864, 129, 64, 123], [928, 130, 64, 123]] },  // window with blinds
      { at: [375, 140], frames: [[714, 196, 39, 89]] },                                               // plant poster
      { at: [430, 175], frames: [[452, 200, 25, 46], [484, 201, 25, 46], [515, 200, 25, 46],
                                 [452, 264, 25, 46], [484, 265, 25, 46], [515, 264, 25, 46]] },        // cat portrait
    ];

    // Floorboards, in picture pixels: plank colours (picked per board), the
    // gap between boards, and how wide and long the boards are.
    const WOOD = {
      planks: [[196, 138, 90], [186, 126, 80], [205, 150, 102], [178, 120, 76]],
      seam: [132, 84, 52],
      width: 10,
      length: 40,
    };

    // The sky behind the room. By default it follows the viewer's clock: each
    // picture shows from the local hour `from` until the next one starts.
    // The Sky button can also pin one of them, or a plain dark backdrop.
    const SKIES = [
      { name: 'Fajr', from: 4, src: 'backgrounds/fajrbackground.png' },          // before sunrise
      { name: 'Dawn', from: 6, src: 'backgrounds/dawnbackground.png' },
      { name: 'Noon', from: 9, src: 'backgrounds/noonbackground.png' },
      { name: 'Sunset', from: 17, src: 'backgrounds/sunsetbackground.png' },
      { name: 'Night', from: 20, src: 'backgrounds/nightbackgroundwithmoon.png' },
    ];
    const DEFAULT_SKY = 'clock';

    // Pixel effects: strips of square frames in effects/, made from the GIFs
    // in "Pixel effects" by tools/build_effects.py. `at` is where they play on
    // whatever they're about: above its head, or over its middle.
    const EFFECTS = {
      hearts: { at: 'head' }, sparkle: { at: 'body' }, sleep: { at: 'head' }, smoke: { at: 'body' },
      alert: { at: 'head' }, scrap: { at: 'body' }, pounce: { at: 'body' }, music: { at: 'head' },
      party: { at: 'body' },
    };
    const FX_SPEED = 0.25;                              // ≈ 15 fps, the speed the GIFs were made for
    // Pop-ups shown as a pixel effect; any other emoji floats up as text.
    const EMOTE_EFFECT = { '❤️': 'hearts', '✨': 'sparkle', '💤': 'sleep', '💨': 'smoke', '❗': 'alert',
                           '💢': 'scrap', '😋': 'music' };

    // What the room looks like at first. Positions are fractions of the
    // floor's width (left → right) and depth (back → front).
    const START = [
      ['Cream cat', .5, .55], ['Blue bowl', .3, .42], ['Blue bed', .72, .45],
      ['Blue ball', .42, .72], ['Green scratcher', .6, .3], ['Toy mouse', .3, .62],
      ['Fig in a brown pot', .44, .12], ['Cream table', .18, .58],
    ];

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------
    const rand = (min, max) => min + Math.random() * (max - min);
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const clampTo = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const every = (sec, fn) => { let t = sec; return dt => { if ((t -= dt) <= 0) { t = sec; fn(); } }; };
    const isOver = (el, ev) => {
      const r = el.getBoundingClientRect();
      return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    };

    // Cut `count` frames (w×h, every `stride` px to the right) out of a sheet.
    // Also finds the bounds of the opaque pixels across all frames so the
    // sprite can be anchored at its feet – centred on the body, bottom on the
    // lowest pixel. That keeps every animation standing on the same spot
    // instead of hopping around when it switches or flips direction.
    // Done once at load time, never per frame.
    function cut(texture, [x, y, w, h], count = 1, stride = w) {
      const img = texture.source.resource;
      const ctx = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height })
        .getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);

      let left = w, right = -1, top = h, bottom = -1;
      const textures = [];
      for (let i = 0; i < count; i++) {
        const fx = x + i * stride;
        textures.push(new PIXI.Texture({ source: texture.source, frame: new PIXI.Rectangle(fx, y, w, h) }));
        const { data } = ctx.getImageData(fx, y, w, h);
        for (let p = 0; p < w * h; p++) {
          if (!data[p * 4 + 3]) continue;
          const px = p % w, py = Math.floor(p / w);
          left = Math.min(left, px); right = Math.max(right, px);
          top = Math.min(top, py); bottom = Math.max(bottom, py);
        }
      }
      if (bottom < 0) [left, right, top, bottom] = [0, w - 1, 0, h - 1];   // fully transparent
      const foot = { x: (left + right + 1) / 2, y: bottom + 1 };
      return {
        textures, img, foot,
        anchor: { x: foot.x / w, y: foot.y / h },
        crop: [x + left, y + top, right - left + 1, bottom - top + 1],     // opaque part of frame 0
      };
    }

    // A small <canvas> picture of a catalogue entry, `k` CSS px per sprite px.
    function thumb(def, k) {
      const [x, y, w, h] = def.look.crop;
      const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
      c.getContext('2d').drawImage(def.look.img, x, y, w, h, 0, 0, w, h);
      c.style.width = `${w * k}px`;
      c.style.height = `${h * k}px`;
      if (k < 1) c.style.imageRendering = 'auto';           // shrinking: smooth beats jagged
      return c;
    }
    const fitScale = (def, box) => {
      const k = box / Math.max(def.look.crop[2], def.look.crop[3]);
      return k >= 1 ? Math.floor(k) : k;
    };

    // Integer hash: stable "random" picks, so the floorboards never shuffle.
    const hash = (a, b) => {
      let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return (h ^ (h >>> 16)) >>> 0;
    };

    // Paint floorboards over the bare floor of a room picture (in place).
    // The floor is found by flood-filling from ROOM.floorSeed through pixels
    // of nearly the same colour, so walls and edges are left alone.
    function layFloor(ctx, w, h) {
      const pic = ctx.getImageData(0, 0, w, h);
      const d = pic.data;
      const [sx, sy] = ROOM.floorSeed;
      const seed = (sy * w + sx) * 4;
      const near = p => d[p * 4 + 3] === 255 && Math.abs(d[p * 4] - d[seed]) <= 12 &&
        Math.abs(d[p * 4 + 1] - d[seed + 1]) <= 12 && Math.abs(d[p * 4 + 2] - d[seed + 2]) <= 12;
      const floor = new Uint8Array(w * h);
      const stack = [sy * w + sx];
      floor[stack[0]] = 1;
      while (stack.length) {
        const p = stack.pop(), x = p % w;
        for (const n of [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w]) {
          if (n >= 0 && n < w * h && !floor[n] && near(n)) { floor[n] = 1; stack.push(n); }
        }
      }

      // Boards run along the right-hand wall. In doubled isometric
      // coordinates, t = 2y − x stays the same along a board and s = 2y + x
      // runs along it; each row of boards starts at a different offset.
      const across = WOOD.width * 2, along = WOOD.length * 2;
      for (let p = 0; p < w * h; p++) {
        if (!floor[p]) continue;
        const x = p % w, y = (p - x) / w;
        const t = 2 * y - x, row = Math.floor(t / across), inRow = t - row * across;
        const s = 2 * y + x + hash(row, 7) % along, board = Math.floor(s / along);
        let [r, g, b] = WOOD.planks[hash(row, board) % WOOD.planks.length];
        if (inRow < 2 || s - board * along < 2) [r, g, b] = WOOD.seam;           // gap between boards
        else if (inRow >> 1 === (WOOD.width >> 1) - 1 && hash(board, s / 6 | 0) % 3 === 0) {
          r -= 14; g -= 14; b -= 14;                                               // grain down the middle
        }
        const wall = [1, 2, 3].find(k => !floor[p - k * w]);                      // shade the foot of the walls
        const shade = wall ? 0.72 + 0.08 * wall : 1;
        d[p * 4] = r * shade;
        d[p * 4 + 1] = g * shade;
        d[p * 4 + 2] = b * shade;
      }
      ctx.putImageData(pic, 0, 0);
    }

    // The full picture for room type i: wooden floor, then the wall decorations.
    function buildRoom(i) {
      const img = art[ROOM_TYPES[i].src];
      const canvas = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height });
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      layFloor(ctx, img.width, img.height);
      for (const { at: [x, y], frames } of WALL_DECOR) {
        const [fx, fy, fw, fh] = frames[i % frames.length];
        ctx.drawImage(art[DECOR], fx, fy, fw, fh, x, y, fw, fh);
      }
      return canvas;
    }

    // A small, smoothly shrunk copy of a room picture, `cssW` CSS px wide.
    function roomThumb(canvas, cssW) {
      const [x, y, w, h] = ROOM.crop;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const c = Object.assign(document.createElement('canvas'),
        { width: Math.round(cssW * dpr), height: Math.round((cssW * h / w) * dpr) });
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, x, y, w, h, 0, 0, c.width, c.height);
      return c;
    }

    function showError(err) {
      console.error(err);
      const el = document.createElement('div');
      el.style.cssText =
        'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;text-align:center;color:#f2f2f7;background:#1b1b24;font:16px/1.5 system-ui,sans-serif;';
      el.textContent = location.protocol === 'file:'
        ? 'Images can\'t load when this page is opened straight from disk. Serve the folder with a local server (e.g. VS Code Live Server, "npx serve", or "python -m http.server") and open it via http://localhost.'
        : `${err.message}. Check that the image files are in the "sprite" folder and match the names in the catalogue.`;
      document.body.appendChild(el);
    }

    // ------------------------------------------------------------------
    // App + loading
    // ------------------------------------------------------------------
    const sceneEl = document.getElementById('scene');
    const paletteEl = document.getElementById('palette');
    const trashEl = document.getElementById('trash');
    const confirmDialog = document.getElementById('confirm');
    const roomsDialog = document.getElementById('rooms');
    const roomGrid = document.getElementById('room-grid');
    const skiesDialog = document.getElementById('skies');
    const skyGrid = document.getElementById('sky-grid');

    PIXI.TextureStyle.defaultOptions.scaleMode = 'nearest';    // crisp pixel art everywhere

    const app = new PIXI.Application();
    await app.init({
      resizeTo: sceneEl,
      backgroundAlpha: 0,                                 // the floor is drawn by CSS
      antialias: false,
      autoDensity: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      roundPixels: true,
      powerPreference: 'high-performance',
    });
    sceneEl.appendChild(app.canvas);
    new ResizeObserver(() => app.queueResize()).observe(sceneEl);

    const art = {};                                     // url → loaded image, for drawing on canvases

    async function loadArt() {
      const urlsOf = d => d.kind === 'cat' ? Object.values(d.files).map(f => `sprite/${d.dir}${f}.png`) : [d.src];
      const fxUrl = name => `effects/${name}.png`;
      const urls = [...new Set([...CATALOG.flatMap(urlsOf), ...ROOM_TYPES.map(r => r.src), ...Object.keys(EFFECTS).map(fxUrl)])];
      const tex = await PIXI.Assets.load(urls);
      for (const url of urls) art[url] = tex[url].source.resource;
      for (const [name, effect] of Object.entries(EFFECTS)) {
        const t = tex[fxUrl(name)];
        effect.textures = cut(t, [0, 0, t.height, t.height], Math.round(t.width / t.height)).textures;
      }
      for (const d of CATALOG) {
        if (d.kind !== 'cat') { d.look = cut(tex[d.src], d.frame, d.frames, d.stride); continue; }
        d.anim = {};
        for (const [name, file] of Object.entries(d.files)) {
          const t = tex[`sprite/${d.dir}${file}.png`];
          d.anim[name] = cut(t, [0, 0, t.height, t.height], Math.round(t.width / t.height));
        }
        d.look = d.anim.idle;
      }
    }

    // ------------------------------------------------------------------
    // Scene + entities
    // ------------------------------------------------------------------
    // Every cat and object is an entity standing on the floor at (x, y) – its
    // feet. `lift` raises the picture without moving it on the floor (a ball's
    // hop, a cat up the cat tree) and things further down the screen are drawn
    // in front.
    const entities = [];
    const room = new PIXI.Sprite();
    const shadows = new PIXI.Container();
    const world = new PIXI.Container({ sortableChildren: true });
    const fx = new PIXI.Container();
    app.stage.addChild(room, shadows, world, fx);
    const shadowShape = new PIXI.GraphicsContext().ellipse(0, 0, 1, 0.3).fill({ color: 0x000000, alpha: 0.25 });
    const HAS_SHADOW = new Set(['cat', 'ball', 'mouse']);

    // The room is drawn as big as fits: picture pixel (px, py) lands on
    // (view.x + px·k, view.y + py·k), and everything else is sized to match.
    const view = { k: ROOM.base, x: 0, y: 0 };
    const unit = () => view.k / ROOM.base;
    const sizeOf = def => Math.max(1, Math.round(def.scale * unit()));

    function layout() {
      const { width, height } = app.screen;
      const [cx, cy, cw, ch] = ROOM.crop;
      const best = Math.min(width / cw, height / ch) * 0.96;
      // A whole-number zoom keeps the pixel art crisp; only give that up when it would shrink the room a lot.
      const k = Math.floor(best) >= 1 && Math.floor(best) / best > 0.85 ? Math.floor(best) : best;
      const x = Math.round((width - cw * k) / 2 - cx * k);
      const y = Math.round((height - ch * k) / 2 - cy * k);

      // Carry everything over, so it keeps its place in the room.
      const r = k / view.k;
      const move = (px, py) => [x + (px - view.x) * r, y + (py - view.y) * r];
      for (const e of entities) {
        [e.x, e.y] = move(e.x, e.y);
        if (e.tx !== undefined) [e.tx, e.ty] = move(e.tx, e.ty);
        e.vx *= r;
        e.vy *= r;
        e.lift *= r;
      }
      Object.assign(view, { k, x, y });
      room.position.set(x, y);
      room.scale.set(k);
      for (const e of entities) { fit(e); clamp(e); }
    }

    // The floor is a diamond. In the coordinates p = u + v, q = u − v (where
    // u, v are the offset from its centre in half-diagonals) it is the square
    // |p|, |q| ≤ 1, which makes staying on it and bouncing off its edges easy.
    // p runs from the left wall to the front-right edge, q from the front-left
    // edge to the right wall.
    function floorBox() {
      const { x, y, rx, ry } = ROOM.floor;
      return { x: view.x + x * view.k, y: view.y + y * view.k, rx: rx * view.k, ry: ry * view.k };
    }
    const toFloor = (f, x, y) => { const u = (x - f.x) / f.rx, v = (y - f.y) / f.ry; return [u + v, u - v]; };
    const fromFloor = (f, p, q) => [f.x + ((p + q) / 2) * f.rx, f.y + ((p - q) / 2) * f.ry];
    // How far in from the edges (in p, q units) something must stand to fit on the floor.
    const margin = e => Math.min(0.9, e.half / (ROOM.floor.rx * view.k));

    // Pull (x, y) onto the floor, `m` in from its edges. hp / hq say which
    // edges it was pushed back from: −1 or +1, 0 for neither.
    function onFloor(x, y, m = 0) {
      const f = floorBox(), [p, q] = toFloor(f, x, y), lim = 1 - m;
      const hp = p > lim ? 1 : p < -lim ? -1 : 0;
      const hq = q > lim ? 1 : q < -lim ? -1 : 0;
      if (hp || hq) [x, y] = fromFloor(f, hp ? hp * lim : p, hq ? hq * lim : q);
      return { x, y, hp, hq };
    }
    function randomSpot(m = 0) {
      const [x, y] = fromFloor(floorBox(), rand(m - 1, 1 - m), rand(m - 1, 1 - m));
      return { x, y };
    }

    function spawn(def, x, y) {
      const sprite = new PIXI.AnimatedSprite(def.look.textures);
      sprite.anchor.copyFrom(def.look.anchor);
      sprite.eventMode = 'static';
      sprite.cursor = 'grab';
      const e = { def, kind: def.kind, sprite, x, y, lift: 0, z: 0, vx: 0, vy: 0,
                  dir: def.kind === 'cat' && Math.random() < 0.5 ? -1 : 1 };
      sprite.on('pointerdown', ev => startDrag({ e }, ev));
      world.addChild(sprite);
      if (HAS_SHADOW.has(def.kind)) shadows.addChild(e.shadow = new PIXI.Graphics(shadowShape));
      fit(e);
      clamp(e);
      entities.push(e);
      INIT[def.kind]?.(e);
      return e;
    }

    const INIT = {
      cat: c => {
        c.needs = { hunger: rand(.2, .5), tired: rand(0, .3), bored: rand(.4, .7), lonely: rand(0, .3) };
        c.speed = rand(220, 290);
        act(c, 'idle', rand(1, 2));
      },
      bowl: b => setFood(b, 3),
      mouse: m => { m.sprite.animationSpeed = 0.25; m.time = 0; m.stun = 0; },
      wand: w => { w.sprite.animationSpeed = 0.2; w.wiggle = 0; },
      ball: b => { b.hop = 0; },
    };

    function remove(e) {
      if (e.dead) return;
      e.dead = true;
      entities.splice(entities.indexOf(e), 1);
      if (e.kind === 'cat') settle(e);
      else if (e.user) think(e.user);            // whoever was using it finds something else to do
      emote(e, '💨');
      e.sprite.destroy();
      e.shadow?.destroy();
    }

    // Size and on-screen extents; re-run when the room is resized.
    function fit(e) {
      const [, , w, h] = e.def.look.crop;
      e.s = sizeOf(e.def);
      e.half = (w * e.s) / 2;
      e.tall = h * e.s;
      e.shadow?.scale.set(e.half * 0.8);
    }

    // Keep an entity on the floor; returns which edges it hit (see onFloor).
    function clamp(e) {
      const at = onFloor(e.x, e.y, margin(e));
      e.x = at.x;
      e.y = at.y;
      return at;
    }

    function draw(e) {
      const up = held(e);
      e.sprite.position.set(e.x, e.y - e.lift - (up ? 12 : 0));
      e.sprite.scale.set(e.dir * e.s, e.s);
      e.sprite.zIndex = up ? 1e9 : e.y + e.z;
      if (e.shadow) {
        e.shadow.position.set(e.x, e.y);
        e.shadow.visible = e.sprite.visible;
      }
    }

    // Play a pixel effect once at (x, y), then throw it away.
    function effectAt(name, x, y) {
      const { textures, at } = EFFECTS[name];
      const sprite = new PIXI.AnimatedSprite({ textures, loop: false, animationSpeed: FX_SPEED });
      sprite.anchor.set(0.5, at === 'head' ? 1 : 0.5);
      sprite.scale.set(Math.max(1, Math.round(2 * unit())));
      sprite.position.set(x, y);
      sprite.eventMode = 'none';
      sprite.onComplete = () => sprite.destroy();
      fx.addChild(sprite);
      sprite.play();
    }

    // A pop-up above an entity (❤️ 💤 ❗ …): a pixel effect where there is
    // one, otherwise the emoji floating up.
    const emotes = [];
    const EMOTE_STYLE = new PIXI.TextStyle({ fontSize: 22 });
    function emote(e, text) {
      const name = EMOTE_EFFECT[text];
      if (name) {
        const top = e.y - e.lift - e.tall;
        return effectAt(name, e.x, EFFECTS[name].at === 'head' ? top : top + e.tall / 2);
      }
      const t = new PIXI.Text({ text, style: EMOTE_STYLE, anchor: 0.5 });
      t.position.set(e.x, e.y - e.lift - e.tall - 8);
      fx.addChild(t);
      emotes.push({ t, age: 0 });
    }
    function updateEmotes(dt) {
      for (let i = emotes.length - 1; i >= 0; i--) {
        const m = emotes[i];
        m.age += dt;
        m.t.y -= 28 * dt;
        m.t.alpha = Math.max(0, 1 - m.age / 1.5);
        if (m.age >= 1.5) { m.t.destroy(); emotes.splice(i, 1); }
      }
    }

    const nearest = (from, list, jitter = 0) => {
      let best = null, bestD = Infinity;
      for (const e of list) {
        const d = Math.hypot(e.x - from.x, e.y - from.y) * (1 + Math.random() * jitter);
        if (d < bestD) { best = e; bestD = d; }
      }
      return best;
    };
    const face = (a, b) => { if (Math.abs(b.x - a.x) > 1) a.dir = Math.sign(b.x - a.x); };
    const besideX = (cat, item) => item.x + (cat.x < item.x ? -1 : 1) * (item.half + cat.half * 0.4);

    // ------------------------------------------------------------------
    // Cat brain
    // ------------------------------------------------------------------
    // Needs run from 0 (content) to 1 (desperate) and creep up every second.
    // Whenever a cat finishes something it serves its most pressing need with
    // the nearest suitable object (or another cat), otherwise it wanders and
    // lounges. A cat is always either acting (an animation for a while) or
    // moving (to a spot, or chasing something), then runs `next`.
    const NEED_RATE = { hunger: 1 / 100, tired: 1 / 140, bored: 1 / 40, lonely: 1 / 70 };
    const relieve = (cat, need, amount) => { cat.needs[need] = Math.max(0, cat.needs[need] - amount); };

    // How cats use each kind of object. solo = one cat at a time,
    // chase = it moves so the cat follows it, spot = where to stand.
    const USES = {
      bowl:    { need: 'hunger', solo: true, ok: b => b.food > 0, use: eat },
      fish:    { need: 'hunger', solo: true, use: eat },
      bed:     { need: 'tired', solo: true, spot: (cat, bed) => bed.x,
                 use: (cat, bed) => { cat.lift = bed.def.seat * bed.s; cat.z = 1; nap(cat); } },
      hideout: { need: 'tired', solo: true, spot: (cat, home) => home.x, use: hide },
      post:    { need: 'bored', solo: true, use: cat => act(cat, 'attack', 3, () => relieve(cat, 'bored', 0.5)) },
      wand:    { need: 'bored', solo: true, use: cat => act(cat, 'attack', 3.5, () => relieve(cat, 'bored', 0.6)) },
      tree:    { need: 'bored', solo: true, use: climb, spot: (cat, tree) => {
                 cat.perch = pick(PERCHES);
                 return tree.x + (cat.perch[0] - tree.def.look.foot.x) * tree.s;
               } },
      ball:    { need: 'bored', chase: true, use: kick },
      mouse:   { need: 'bored', chase: true, use: pounce },
    };

    function usable(item, cat) {
      const how = USES[item.kind];
      return !!how && !held(item) && !(how.solo && item.user && item.user !== cat) && (how.ok?.(item) ?? true);
    }
    // Awake, on the floor and not tied up with an object.
    const free = c => c.kind === 'cat' && !held(c) && c.sprite.visible && c.anim !== 'sleep' && !c.using;

    function play(cat, name) {
      const a = cat.def.anim[name] ?? cat.def.anim.idle;
      cat.anim = name;
      cat.sprite.textures = a.textures;
      cat.sprite.anchor.copyFrom(a.anchor);
      cat.sprite.animationSpeed = ANIM_SPEED[name];
      cat.sprite.gotoAndPlay(0);
    }

    function act(cat, anim, time, next = null, tick = null) {
      Object.assign(cat, { mode: 'act', time, next, tick });
      play(cat, anim);
    }

    // Run to (x, y), or after `follow` if given, then do `next`.
    function goTo(cat, x, y, next = null, follow = null) {
      const to = onFloor(x, y, margin(cat));
      Object.assign(cat, { mode: 'move', time: 12, next, tick: null, follow, tx: to.x, ty: to.y });
      play(cat, 'run');
    }

    // Let go of whatever the cat was doing.
    function settle(cat) {
      if (cat.using) cat.using.user = null;
      cat.using = cat.follow = cat.next = cat.tick = null;
      cat.lift = cat.z = 0;
      if (!cat.sprite.visible) {                     // step out of a hideaway
        cat.sprite.visible = true;
        cat.y += 8 * unit();
        clamp(cat);
      }
    }

    function think(cat) {
      settle(cat);
      const urgent = Object.keys(cat.needs).filter(k => cat.needs[k] > 0.55)
        .sort((a, b) => cat.needs[b] - cat.needs[a]);
      for (const need of urgent) if (pursue(cat, need)) return;

      if (Math.random() < 0.5) {
        const to = randomSpot(margin(cat));
        goTo(cat, to.x, to.y, () => act(cat, 'idle', rand(1, 3)));
      } else {
        act(cat, pick(['idle', 'sit', 'sit']), rand(2, 5));
      }
    }

    function pursue(cat, need) {
      if (need === 'lonely') {
        const friend = nearest(cat, entities.filter(c => c !== cat && free(c)));
        if (!friend) return false;
        goTo(cat, friend.x, friend.y, () => greet(cat, friend), friend);
        return true;
      }
      const item = nearest(cat, entities.filter(e => USES[e.kind]?.need === need && usable(e, cat)), 0.5);
      if (item) use(cat, item);
      else if (need === 'tired') nap(cat);                       // no bed free: curl up on the floor
      else if (need === 'hunger' && Math.random() < 0.5) {      // no food: beg by an empty bowl
        const bowl = nearest(cat, entities.filter(e => e.kind === 'bowl' && !held(e)));
        if (!bowl) return false;
        goTo(cat, besideX(cat, bowl), bowl.y + 1, () => { face(cat, bowl); emote(cat, '🍽️'); act(cat, 'sit', 3); });
      } else return false;
      return true;
    }

    function use(cat, item) {
      settle(cat);
      const how = USES[item.kind];
      if (how.solo) { item.user = cat; cat.using = item; }
      if (how.chase) return goTo(cat, item.x, item.y, () => how.use(cat, item), item);
      const x = how.spot ? how.spot(cat, item) : besideX(cat, item);
      goTo(cat, x, item.y + 1, () => { face(cat, item); how.use(cat, item); });
    }

    function eat(cat, food) {
      act(cat, 'sit', 3, () => {
        emote(cat, '😋');
        if (food.kind === 'fish') {
          relieve(cat, 'hunger', 0.6);
          remove(food);
        } else {
          relieve(cat, 'hunger', 0.8);
          setFood(food, food.food - 1);
        }
      });
    }

    function setFood(bowl, n) {
      bowl.food = n;
      bowl.sprite.tint = n > 0 ? 0xffffff : 0x55556a;     // greyed out = empty
    }

    const nap = cat => act(cat, 'sleep', 6 + cat.needs.tired * 12, () => { cat.needs.tired = 0; });

    function hide(cat, home) {
      cat.sprite.visible = false;
      act(cat, 'sleep', 6 + cat.needs.tired * 12, () => { cat.needs.tired = 0; }, every(3, () => emote(home, '💤')));
    }

    function climb(cat, tree) {
      const height = (tree.def.look.foot.y - cat.perch[1]) * tree.s;
      const rise = speed => dt => { cat.lift = clampTo(cat.lift + speed * dt, 0, height); };
      act(cat, 'jump', 0.5, () =>
        act(cat, 'sit', rand(4, 7), () => {
          relieve(cat, 'bored', 0.4);
          relieve(cat, 'tired', 0.2);
          act(cat, 'jump', 0.5, () => { cat.lift = 0; }, rise(-height / 0.5));
        }), rise(height / 0.5));
    }

    function kick(cat, ball) {
      face(cat, ball);
      if (held(ball)) return act(cat, 'jump', 1);          // swat at the ball you're dangling
      const a = Math.atan2(ball.y - cat.y, ball.x - cat.x) + rand(-0.6, 0.6);
      const v = rand(350, 600) * unit();
      ball.vx = Math.cos(a) * v;
      ball.vy = Math.sin(a) * v * 0.6;
      relieve(cat, 'bored', 0.2);
      act(cat, 'attack', 0.5, () => {
        if (cat.needs.bored > 0.25 && !ball.dead && Math.random() < 0.7) use(cat, ball);   // after it again!
      });
    }

    function pounce(cat, mouse) {
      face(cat, mouse);
      if (held(mouse)) return act(cat, 'jump', 1);
      effectAt('pounce', mouse.x, mouse.y - mouse.tall / 2);
      relieve(cat, 'bored', 0.4);
      mouse.stun = 1.2;
      fling(mouse, 450);
      act(cat, 'attack', 0.8);
    }

    function greet(cat, friend) {
      if (!free(friend)) return act(cat, 'sit', 2);
      settle(friend);
      face(cat, friend);
      face(friend, cat);
      const scrap = Math.random() < 0.5;                   // play-fight, or just sit together
      for (const c of [cat, friend]) {
        relieve(c, 'lonely', 0.7);
        if (scrap) relieve(c, 'bored', 0.3);
        emote(c, scrap ? '💢' : '❤️');
        act(c, scrap ? 'attack' : 'sit', scrap ? 2 : 4);
      }
    }

    function pet(cat) {
      const asleep = cat.anim === 'sleep';
      settle(cat);
      if (asleep) {
        emote(cat, '❗');
        return act(cat, 'jump', 0.8);
      }
      emote(cat, '❤️');
      relieve(cat, 'lonely', 0.5);
      relieve(cat, 'bored', 0.2);
      act(cat, cat.def.anim.happy ? 'happy' : 'jump', 1.5);
    }

    function updateCat(cat, dt) {
      for (const k in NEED_RATE) cat.needs[k] = Math.min(1, cat.needs[k] + NEED_RATE[k] * dt);
      cat.time -= dt;

      if (cat.mode === 'act') {
        cat.tick?.(dt);
        if (cat.time > 0) return;
      } else if (cat.mode === 'move') {
        const t = cat.follow;
        if (t?.dead || cat.time <= 0) return think(cat);       // target gone, or gave up
        const tx = t ? t.x : cat.tx, ty = t ? t.y : cat.ty;
        const dx = tx - cat.x, dy = ty - cat.y, dist = Math.hypot(dx, dy);
        const reach = t ? t.half + cat.half * 0.6 : 0;
        const step = cat.speed * unit() * dt;
        if (dist - reach > step) {
          cat.x += (dx / dist) * step;
          cat.y += (dy / dist) * step;
          if (Math.abs(dx) > 1) cat.dir = Math.sign(dx);
          return;
        }
        if (!t) { cat.x = tx; cat.y = ty; }
      }
      // Done: run the follow-up, or work out what to do next.
      const next = cat.next;
      cat.mode = cat.next = cat.tick = null;
      next?.();
      if (!cat.mode) think(cat);
    }

    // ------------------------------------------------------------------
    // Objects that move on their own
    // ------------------------------------------------------------------
    function fling(e, speed) {
      const a = rand(0, Math.PI * 2);
      e.vx = Math.cos(a) * speed * unit();
      e.vy = Math.sin(a) * speed * 0.6 * unit();
    }

    // Slide by velocity and bounce off the walls and edges of the floor.
    function slide(e, dt, friction) {
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      const { hp, hq } = clamp(e);
      if (hp || hq) {                                       // flip the velocity across the edge it hit
        const f = floorBox();
        let vp = e.vx / f.rx + e.vy / f.ry, vq = e.vx / f.rx - e.vy / f.ry;
        if (hp && Math.sign(vp) === hp) vp *= -0.8;
        if (hq && Math.sign(vq) === hq) vq *= -0.8;
        e.vx = ((vp + vq) / 2) * f.rx;
        e.vy = ((vp - vq) / 2) * f.ry;
      }
      const f = Math.exp(-friction * dt);
      e.vx *= f;
      e.vy *= f;
    }

    function updateBall(b, dt) {
      slide(b, dt, 1.2);
      const speed = Math.hypot(b.vx, b.vy);
      b.hop += (dt * speed) / 25;
      b.lift = Math.abs(Math.sin(b.hop)) * Math.min(speed / 12, 24 * unit());
    }

    function updateMouse(m, dt) {
      const u = unit();
      if (m.stun > 0) {
        m.stun -= dt;
        slide(m, dt, 4);
      } else {
        const cat = nearest(m, entities.filter(c => c.kind === 'cat' && !held(c) && c.sprite.visible && c.anim !== 'sleep'));
        const d = cat ? Math.max(1, Math.hypot(m.x - cat.x, m.y - cat.y)) : Infinity;
        if (d < 170 * u) {                                     // run away from the cat
          m.vx = ((m.x - cat.x) / d) * 210 * u;
          m.vy = ((m.y - cat.y) / d) * 210 * u;
          m.time = 0.5;
        } else if ((m.time -= dt) <= 0) {                      // potter about, sometimes pause
          m.time = rand(1, 3);
          const a = rand(0, Math.PI * 2), v = Math.random() < 0.4 ? 0 : 70 * u;
          m.vx = Math.cos(a) * v;
          m.vy = Math.sin(a) * v * 0.6;
        }
        slide(m, dt, 0);
      }
      const moving = Math.hypot(m.vx, m.vy) > 5;
      if (moving !== m.sprite.playing) moving ? m.sprite.play() : m.sprite.stop();
      if (Math.abs(m.vx) > 5) m.dir = Math.sign(m.vx);
    }

    function updateWand(w, dt) {
      w.wiggle -= dt;
      const busy = w.wiggle > 0 || w.user?.mode === 'act';
      if (busy !== w.sprite.playing) busy ? w.sprite.play() : w.sprite.gotoAndStop(0);
    }

    const UPDATE = { cat: updateCat, ball: updateBall, mouse: updateMouse, wand: updateWand };

    // ------------------------------------------------------------------
    // Clicking things
    // ------------------------------------------------------------------
    const CLICK = {
      bowl: b => { setFood(b, 3); emote(b, '✨'); },                            // refill
      bag: () => entities.filter(e => e.kind === 'bowl').forEach(CLICK.bowl),  // refill every bowl
      ball: b => fling(b, 550),
      mouse: m => { fling(m, 260); m.time = 1; emote(m, '❗'); },
      wand: w => { w.wiggle = 2; },
    };

    function clickItem(item) {
      if (item.kind === 'hideout' && item.user && !item.user.sprite.visible) return pet(item.user);   // knock knock
      CLICK[item.kind]?.(item);
      // …and the nearest cat that isn't busy comes over to check it out.
      const cat = usable(item) && nearest(item, entities.filter(free));
      if (cat) use(cat, item);
    }

    // ------------------------------------------------------------------
    // Drag & drop – from the control bar into the scene, around the scene,
    // and onto the trash. One pointer at a time; a press that doesn't move
    // counts as a click.
    // ------------------------------------------------------------------
    let drag = null;
    let dragMoved = false;          // lets a bar button ignore the click that ends a drag
    const held = e => !!drag?.moved && drag.e === e;
    const tmp = new PIXI.Point();
    const toWorld = (clientX, clientY) => {
      app.renderer.events.mapPositionToPoint(tmp, clientX, clientY);
      return { x: tmp.x, y: tmp.y };
    };

    function startDrag(target, ev) {
      if (drag || ev.button !== 0) return;
      drag = { ...target, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false };
      dragMoved = false;
      addEventListener('pointermove', onDragMove);
      addEventListener('pointerup', endDrag);
      addEventListener('pointercancel', endDrag);
    }

    function pickUp() {
      const { e, def } = drag;
      document.body.classList.add('dragging');
      if (def) {
        const k = sizeOf(def);
        drag.ghost = thumb(def, k);
        drag.ghost.className = 'ghost';
        drag.gw = def.look.crop[2] * k;
        drag.gh = def.look.crop[3] * k;
        document.body.appendChild(drag.ghost);
        return;
      }
      const p = toWorld(drag.sx, drag.sy);
      Object.assign(drag, { ox: e.x - p.x, oy: e.y - p.y, homeX: e.x, homeY: e.y });
      if (e.kind === 'cat') {
        settle(e);
        e.mode = null;
        play(e, 'jump');
        e.sprite.gotoAndStop(3);                            // mid-leap: legs dangling
      } else {
        if (e.user) think(e.user);
        e.vx = e.vy = 0;
      }
    }

    function onDragMove(ev) {
      if (ev.pointerId !== drag.id) return;
      if (!drag.moved) {
        if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 6) return;
        drag.moved = dragMoved = true;
        pickUp();
      }
      if (drag.e) {
        const p = toWorld(ev.clientX, ev.clientY);
        drag.e.x = p.x + drag.ox;
        drag.e.y = p.y + drag.oy;
        clamp(drag.e);
        trashEl.classList.toggle('armed', isOver(trashEl, ev));
      } else {
        drag.ghost.style.transform = `translate(${ev.clientX - drag.gw / 2}px, ${ev.clientY - drag.gh}px)`;
      }
    }

    function endDrag(ev) {
      if (ev.pointerId !== drag.id) return;
      removeEventListener('pointermove', onDragMove);
      removeEventListener('pointerup', endDrag);
      removeEventListener('pointercancel', endDrag);
      document.body.classList.remove('dragging');
      trashEl.classList.remove('armed');
      const { e, def, moved, ghost, homeX, homeY } = drag;
      drag = null;
      ghost?.remove();
      const cancelled = ev.type === 'pointercancel';

      if (!moved) {
        if (e && !cancelled) e.kind === 'cat' ? pet(e) : clickItem(e);
        return;
      }
      if (def) {                                            // new thing from the bar
        if (!cancelled && isOver(sceneEl, ev)) {
          const p = toWorld(ev.clientX, ev.clientY);
          emote(spawn(def, p.x, p.y), '✨');
        }
        return;
      }
      if (e.kind === 'cat') act(e, 'sit', 0.8);
      if (!cancelled && isOver(trashEl, ev)) {              // put it back while we ask
        e.x = homeX;
        e.y = homeY;
        confirmDelete(e);
      }
    }

    // ------------------------------------------------------------------
    // Dialogs
    // ------------------------------------------------------------------
    // Open a modal <dialog>; resolves with the value of the button that
    // closed it, or '' for Esc.
    function showDialog(d) {
      d.returnValue = '';
      d.showModal();
      return new Promise(resolve => d.addEventListener('close', () => resolve(d.returnValue), { once: true }));
    }

    // Yes/no question; `text` is a list of strings and elements. Resolves true for yes.
    async function ask({ pic = null, text, yes, no }) {
      document.getElementById('confirm-pic').replaceChildren(...(pic ? [pic] : []));
      document.getElementById('confirm-text').replaceChildren(...text);
      document.getElementById('confirm-yes').textContent = yes;
      document.getElementById('confirm-no').textContent = no;
      return (await showDialog(confirmDialog)) === 'ok';
    }

    async function confirmDelete(e) {
      const name = Object.assign(document.createElement('strong'), { textContent: e.def.name });
      const yes = await ask({ pic: thumb(e.def, fitScale(e.def, 64)), text: ['Delete ', name, ' from the room?'],
                              yes: 'Delete', no: 'Keep it' });
      if (yes) remove(e);
    }

    async function confirmReset() {
      const yes = await ask({ text: ['Reset the room? Everything goes back to how it was at the start.'],
                              yes: 'Reset', no: 'Cancel' });
      if (yes) reset();
    }

    // ------------------------------------------------------------------
    // Room type and reset
    // ------------------------------------------------------------------
    let roomType = -1;

    function setRoom(i) {
      if (i === roomType) return;
      roomType = i;
      const picture = buildRoom(i);
      const old = room.texture;
      room.texture = PIXI.Texture.from(picture, true);
      if (old !== PIXI.Texture.EMPTY) old.destroy(true);
      document.getElementById('room-pic').replaceChildren(roomThumb(picture, 32));
    }

    // Open a picker dialog. `options` is a function returning
    // [{ value, label, pic }], called the first time only. Resolves with the
    // chosen value as a string, or null if it was closed without a choice.
    async function choose(dialog, grid, options, current) {
      if (!grid.children.length) {
        for (const { value, label, pic } of options()) {
          const b = document.createElement('button');
          b.value = value;                                  // closes the dialog with this value
          b.append(pic, label);
          grid.appendChild(b);
        }
      }
      for (const b of grid.children) b.setAttribute('aria-current', String(b.value === String(current)));
      const choice = await showDialog(dialog);
      return choice === '' ? null : choice;
    }

    async function pickRoom() {
      const choice = await choose(roomsDialog, roomGrid, () => ROOM_TYPES.map(({ name }, i) =>
        ({ value: i, label: `${name} room`, pic: roomThumb(buildRoom(i), 64) })), roomType);
      if (choice !== null) setRoom(Number(choice));
    }

    // ------------------------------------------------------------------
    // Sky
    // ------------------------------------------------------------------
    let skyChoice = DEFAULT_SKY;                          // 'clock', 'dark' or an index into SKIES

    const clockSky = (now = new Date()) => {
      const hour = now.getHours() + now.getMinutes() / 60;
      return SKIES.findLast(sky => hour >= sky.from) ?? SKIES.at(-1);   // before 4am: still night
    };
    const skySrc = now => skyChoice === 'clock' ? clockSky(now).src : skyChoice === 'dark' ? '' : SKIES[skyChoice].src;

    function skyThumb(src) {
      const pic = document.createElement('span');
      pic.className = 'sky-thumb';
      if (src) pic.style.backgroundImage = `url("${src}")`;
      return pic;
    }

    // Show the chosen sky; with 'clock' this is re-run every minute.
    function updateSky(now = new Date()) {
      const src = skySrc(now);
      if (sceneEl.dataset.sky === src) return;
      sceneEl.dataset.sky = src;
      sceneEl.style.backgroundImage = src ? `url("${src}")` : 'none';
      document.getElementById('sky-pic').replaceChildren(skyThumb(src));
    }

    function setSky(choice) {
      skyChoice = choice;
      updateSky();
    }

    async function pickSky() {
      const choice = await choose(skiesDialog, skyGrid, () => [
        { value: 'clock', label: 'Follow the clock', pic: skyThumb(clockSky().src) },
        ...SKIES.map(({ name, src }, i) => ({ value: i, label: name, pic: skyThumb(src) })),
        { value: 'dark', label: 'Dark', pic: skyThumb('') },
      ], skyChoice);
      if (choice !== null) setSky(/^\d+$/.test(choice) ? Number(choice) : choice);
    }

    function populate() {
      const f = floorBox();
      for (const [name, fx, fy] of START) {
        spawn(CATALOG.find(d => d.name === name), f.x + (fx * 2 - 1) * f.rx, f.y + (fy * 2 - 1) * f.ry);
      }
    }

    // Back to the starting room: default room type, starting cats and things.
    function reset() {
      if (drag) endDrag({ pointerId: drag.id, type: 'pointercancel' });
      for (const e of entities) {
        e.dead = true;
        e.sprite.destroy();
        e.shadow?.destroy();
      }
      entities.length = 0;
      for (const child of fx.removeChildren()) child.destroy();   // pop-ups and effects
      emotes.length = 0;
      setRoom(DEFAULT_ROOM);
      setSky(DEFAULT_SKY);
      populate();
      const f = floorBox();
      effectAt('party', f.x, f.y);
    }

    // ------------------------------------------------------------------
    // Control bar
    // ------------------------------------------------------------------
    // A button that opens and closes a group of items.
    function makeToggle(name, label, def) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'toggle';
      button.setAttribute('aria-label', name);
      if (def) button.appendChild(thumb(def, fitScale(def, 28)));
      const text = Object.assign(document.createElement('span'), { className: 'label', textContent: label });
      const sign = Object.assign(document.createElement('span'), { className: 'sign', textContent: '+' });
      sign.setAttribute('aria-hidden', 'true');
      button.append(text, sign);
      return button;
    }

    // Each group of items sits behind its own button: + opens it, − closes
    // it. Opening one group closes the others; "All" opens or closes them all.
    function buildPalette() {
      const groups = [];
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const setOpen = (g, open) => {
        g.row.hidden = !open;
        g.toggle.setAttribute('aria-expanded', String(open));
        g.toggle.querySelector('.sign').textContent = open ? '−' : '+';
      };
      const allButton = makeToggle('All items', 'All', null);
      const syncAll = () => {
        const open = groups.every(g => !g.row.hidden);
        allButton.setAttribute('aria-expanded', String(open));
        allButton.querySelector('.sign').textContent = open ? '−' : '+';
      };
      paletteEl.appendChild(allButton);

      for (const [group, defs] of Map.groupBy(CATALOG, d => d.group)) {
        const section = document.createElement('section');
        section.className = 'group';
        const row = document.createElement('div');
        row.id = `group-${group.toLowerCase()}`;
        const toggle = makeToggle(group, group, defs[0]);
        toggle.setAttribute('aria-controls', row.id);
        section.append(toggle, row);
        const g = { toggle, row };
        groups.push(g);

        toggle.addEventListener('click', () => {
          const open = row.hidden;
          for (const other of groups) setOpen(other, open && other === g);
          syncAll();
          if (open) {                                      // bring the opened group into view
            const left = section.getBoundingClientRect().left - paletteEl.getBoundingClientRect().left;
            paletteEl.scrollTo({ left: paletteEl.scrollLeft + left - 8, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
          }
        });

        for (const def of defs) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'item';
          button.title = `${def.name} – drag into the scene, or click to add`;
          button.setAttribute('aria-label', `Add ${def.name}`);
          button.appendChild(thumb(def, fitScale(def, 40)));
          button.addEventListener('pointerdown', ev => startDrag({ def }, ev));
          button.addEventListener('click', ev => {
            if (ev.detail && dragMoved) return;              // this click just ended a drag
            const at = randomSpot();
            emote(spawn(def, at.x, at.y), '✨');
          });
          row.appendChild(button);
        }
        paletteEl.appendChild(section);
      }

      allButton.setAttribute('aria-controls', groups.map(g => g.row.id).join(' '));
      allButton.addEventListener('click', () => {
        const open = groups.some(g => g.row.hidden);
        for (const g of groups) setOpen(g, open);
        syncAll();
      });
      groups.forEach((g, i) => setOpen(g, i === 0));       // start with the cats showing
      syncAll();
      // Mouse wheel scrolls the bar sideways.
      paletteEl.addEventListener('wheel', ev => {
        if (ev.deltaX || !ev.deltaY) return;
        paletteEl.scrollLeft += ev.deltaY;
        ev.preventDefault();
      }, { passive: false });
    }

    // ------------------------------------------------------------------
    // Main
    // ------------------------------------------------------------------
    function start() {
      buildPalette();
      updateSky();
      setInterval(updateSky, 60_000);
      setRoom(DEFAULT_ROOM);
      layout();
      populate();

      app.renderer.on('resize', layout);
      document.getElementById('room-button').addEventListener('click', pickRoom);
      document.getElementById('sky-button').addEventListener('click', pickSky);
      document.getElementById('reset').addEventListener('click', confirmReset);

      // Frame-rate independent via deltaMS; capped so a hidden tab doesn't teleport things.
      app.ticker.add(({ deltaMS }) => {
        const dt = Math.min(deltaMS / 1000, 0.1);
        for (const e of [...entities]) if (!e.dead && !held(e)) UPDATE[e.kind]?.(e, dt);
        for (const e of entities) draw(e);
        updateEmotes(dt);
      });
    }

    loadArt().then(start, showError);
  </script>
</body>
</html>
