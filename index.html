<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cat Playground</title>
  <meta name="description" content="A cozy pixel-art room full of cats to play with.">
  <meta name="theme-color" content="#6e564a">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <style>
    /* Colours and frames come from the cat UI sheet (CatUserInterface/CatUI.png);
       tools/build_ui.py cuts the pieces used here into ui/. Every piece is
       drawn at exactly 2× so its pixels stay crisp. */
    :root {
      color-scheme: light;
      --ink: #403939;                       /* outlines and text */
      --cream: #f6e8d6;
      --sand: #d2c4b2;
      --tan: #bea187;
      --cocoa: #6e564a;
      --cocoa-dark: #4f3d35;
      --muted: #7d6b60;
      --focus: #ff8a3d;                     /* shows on both cream and cocoa */
      --danger: #c8553d;
      --bg: #2a2230;                        /* behind the room when the sky is "Dark" */
      --font: "Pixelify Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: minmax(0, 1fr);
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.3 var(--font);
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    img, canvas { image-rendering: pixelated; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ---- Pixel frames ---- */
    /* Rounded cream square, stretched to any size. */
    .tile {
      border: 8px solid transparent;
      border-image: url("assets/ui/tile.png") 4 fill / 8px;
      background: none;
      image-rendering: pixelated;
      cursor: pointer;
    }
    .tile:hover { filter: brightness(1.04); }
    .tile:active { border-image-source: url("assets/ui/tile-down.png"); }
    .tile[aria-expanded="true"], .tile[aria-current="true"], .tile[aria-pressed="true"] {
      border-image-source: url("assets/ui/tile-sand.png");
    }
    /* Long button with a darker bottom edge. */
    .btn {
      min-width: 92px;
      padding: 0 12px;
      border-style: solid;
      border-color: transparent;
      border-width: 6px 6px 10px;
      border-image: url("assets/ui/button.png") 3 3 5 fill / 6px 6px 10px;
      background: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      line-height: 20px;
      image-rendering: pixelated;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: translateY(2px); }
    .btn.dark { border-image-source: url("assets/ui/button-dark.png"); color: var(--cream); }
    /* Cream panel with cat ears; content sits below the ears. */
    .panel {
      border-style: solid;
      border-color: transparent;
      border-width: 46px 14px 16px;
      border-image: url("assets/ui/panel.png") 26 25 12 fill / 52px 50px 24px;
      background: none;
      color: var(--ink);
      image-rendering: pixelated;
    }
    /* Cat head on the left, a bar for text on the right. */
    .nameplate {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border-style: solid;
      border-color: transparent;
      border-width: 6px 8px 6px 46px;
      border-image: url("assets/ui/nameplate.png") 3 4 3 23 fill / 6px 8px 6px 46px;
      image-rendering: pixelated;
    }

    /* ---- Control bar: everything you can add, plus the tools ---- */
    .bar {
      display: flex;
      gap: 12px;
      padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      background: var(--cocoa);
      border-bottom: 4px solid var(--cocoa-dark);
    }
    .palette {
      flex: 1;
      min-width: 0;                         /* let it scroll instead of widening the page */
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--tan) transparent;
      padding-bottom: 2px;
    }
    .group, .group > div { display: flex; gap: 6px; }
    .group > div[hidden] { display: none; }

    /* A group's button: picture, name, and + (closed) or − (open). */
    .toggle {
      flex: none;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 2px;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
    }
    .toggle canvas { pointer-events: none; }
    .toggle .sign { width: 28px; height: 28px; }
    .item {
      flex: none;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      cursor: grab;
      touch-action: pan-x;                  /* swipe sideways scrolls the bar, drag down places the item */
      user-select: none;
      -webkit-touch-callout: none;
    }
    .item canvas, .ghost, .pic canvas { pointer-events: none; }

    .tools { flex: none; display: flex; gap: 8px; }
    .tool, .trash {
      flex: none;
      width: 72px;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 2px;
      font-size: 12px;
      font-weight: 600;
    }
    .tool { padding: 0; }
    .tool canvas, .tool .sky-thumb { display: block; width: 32px; height: 28px; }
    .dragging .tool { pointer-events: none; }
    .trash {
      border: 2px dashed var(--sand);
      border-radius: 10px;
      color: var(--cream);
      transition: background-color .15s, border-color .15s, transform .15s;
    }
    .dragging .trash { border-color: var(--cream); }
    .trash.armed {
      background: color-mix(in srgb, var(--danger) 45%, transparent);
      border-color: var(--cream);
      transform: scale(1.06);
    }

    /* ---- Scene: the room sits in the middle of this backdrop ---- */
    #scene {
      position: relative;
      min-height: 0;
      background: var(--bg) center / cover no-repeat;      /* the sky picture is set from the clock */
      image-rendering: pixelated;
      transition: background-image 1.5s;
    }
    #scene canvas { position: absolute; inset: 0; display: block; touch-action: none; }

    .ghost { position: fixed; left: 0; top: 0; z-index: 10; opacity: .85; }
    .dragging, .dragging * { cursor: grabbing !important; user-select: none; }

    /* ---- Dialogs ---- */
    dialog {
      width: min(340px, calc(100vw - 24px));
      padding: 4px 10px 6px;
      text-align: center;
      overflow: visible;
    }
    dialog::backdrop { background: rgb(40 28 28 / .5); }
    dialog p { margin: 4px 0 16px; font-size: 17px; }
    .pic { display: grid; place-items: center; min-height: 64px; }
    .pic:empty { display: none; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }

    /* ---- Room and sky pickers ---- */
    .picker { width: min(580px, calc(100vw - 24px)); }
    .picker h2 { margin: 0 0 12px; font-size: 20px; }
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 6px;
      margin-bottom: 14px;
    }
    .room-grid button {
      display: grid;
      justify-items: center;
      gap: 2px;
      padding: 0;
      font-size: 13px;
      line-height: 1.1;
    }
    .room-grid canvas, .room-grid .sky-thumb { width: 64px; height: 56px; }
    .sky-thumb {
      border-radius: 4px;
      background: var(--bg) center / cover no-repeat;
      image-rendering: pixelated;
    }

    /* ---- Cat menu (a popover next to the cat) ---- */
    .cat-menu {
      position: fixed;
      inset: auto;
      margin: 0;
      width: 252px;
      padding: 0 6px 4px;
      overflow: visible;
    }
    .cat-menu label { display: block; }
    .cat-menu .nameplate { width: 100%; margin-bottom: 8px; }
    .cat-menu input {
      width: 100%;
      min-width: 0;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 600 17px/24px var(--font);
    }
    .cat-menu input:focus-visible { outline: none; }
    .cat-menu .nameplate:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
    .needs { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin: 0 2px 10px; font-size: 13px; }
    .meter {
      align-self: center;
      height: 12px;
      border: 2px solid var(--ink);
      border-radius: 3px;
      background: var(--sand);
      overflow: hidden;
    }
    .meter > span { display: block; height: 100%; background: var(--fill, var(--tan)); transition: width .3s; }
    .cat-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .cat-actions button {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 2px;
      height: 62px;
      padding: 0;
      font-size: 13px;
    }
    .cat-actions img { height: 26px; width: auto; }

    /* ---- Sound menu (a popover under the Sound button) ---- */
    .sound-menu {
      position: fixed;
      inset: auto;
      margin: 0;
      width: 280px;
      padding: 0 8px 6px;
      overflow: visible;
    }
    .sound-menu h2 { margin: 0 0 8px; font-size: 20px; text-align: center; }
    .sound-menu h3 { margin: 0; font-size: 16px; }
    .sound-part + .sound-part { margin-top: 12px; padding-top: 10px; border-top: 2px dashed var(--sand); }
    .sound-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .switch { min-width: 64px; height: 36px; padding: 0; font-weight: 600; }
    .tracks { display: grid; gap: 4px; margin: 0 0 8px; padding: 0; border: 0; }
    .tracks label {
      display: block;
      padding: 0 4px;
      font-size: 14px;
      line-height: 22px;
      cursor: pointer;
    }
    .tracks input { position: absolute; opacity: 0; pointer-events: none; }
    .tracks label:has(input:checked) { border-image-source: url("assets/ui/tile-sand.png"); }
    .tracks label:has(input:checked)::before { content: "♪ "; }
    .tracks label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
    .volume { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .volume input { flex: 1; accent-color: var(--cocoa); }
    #sound-button[data-music="off"] .waves { opacity: .25; }

    /* ---- Signature, on a cat name plate ---- */
    .signature {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(var(--yard-strip, 0px) + 12px);     /* just above the play area */
      z-index: 5;
      gap: 8px;
      margin: 0;
      padding: 2px 16px 2px 10px;           /* script fonts lean right: leave them room */
      align-items: center;
      font-size: 12px;
      white-space: nowrap;
      color: var(--ink);
      text-decoration: none;
    }
    .signature:hover .name, .signature:focus-visible .name { text-decoration: underline; text-underline-offset: 3px; }
    .signature .name {
      font: 20px/1.25 "Segoe Script", "Bradley Hand", "Snell Roundhand", "Brush Script MT", cursive;
      letter-spacing: .02em;
    }

    @media (max-width: 600px) {
      /* Tools on top, the item groups get a full-width row underneath. */
      .bar { flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
      .tools { order: -1; width: 100%; justify-content: flex-end; }
      .palette { flex-basis: 100%; }
      .toggle { height: 44px; }
      .toggle canvas + .label { display: none; }         /* the picture and aria-label name it */
      .item { width: 44px; height: 44px; }
      .tools { gap: 4px; }
      .tool, .trash { width: 48px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #scene, .trash { transition: none; }
    }
  </style>
</head>
<body>
  <header class="bar" aria-label="Add cats and objects: open a group, then drag an item into the room or click it">
    <nav class="palette" id="palette" aria-label="Items"></nav>
    <div class="tools">
      <button type="button" class="tool tile" id="room-button" title="Choose a room" aria-haspopup="dialog">
        <span id="room-pic" aria-hidden="true"></span>
        Room
      </button>
      <button type="button" class="tool tile" id="sky-button" title="Choose the sky behind the room" aria-haspopup="dialog">
        <span id="sky-pic" aria-hidden="true"></span>
        Sky
      </button>
      <button type="button" class="tool tile" id="sound-button" title="Music and cat sounds" popovertarget="sound-menu">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        </svg>
        Sound
      </button>
      <button type="button" class="tool tile" id="reset" title="Put the room back the way it started">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>
        </svg>
        Reset
      </button>
      <div class="trash" id="trash" title="Drag something here to delete it">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>
        </svg>
        Trash
      </div>
    </div>
  </header>
  <main id="scene"></main>
  <a class="signature nameplate" href="https://williamsham90.github.io/Portfolio/" target="_blank" rel="noopener">
    <span>Made by</span> <span class="name">William Sham</span><span class="visually-hidden"> (portfolio, opens in a new tab)</span>
  </a>

  <!-- Opens next to a cat when it's clicked. -->
  <div id="cat-menu" class="cat-menu panel" popover aria-label="Cat">
    <label class="nameplate">
      <span class="visually-hidden">Name</span>
      <input id="cat-name" maxlength="16" autocomplete="off" spellcheck="false">
    </label>
    <div class="needs" id="cat-needs"></div>
    <div class="cat-actions" id="cat-actions"></div>
  </div>

  <!-- Opens under the Sound button. Music and cat sounds are switched separately. -->
  <div id="sound-menu" class="sound-menu panel" popover aria-labelledby="sound-title">
    <h2 id="sound-title">Sound</h2>
    <section class="sound-part" aria-labelledby="music-title">
      <div class="sound-row">
        <h3 id="music-title">Music</h3>
        <button type="button" class="tile switch" id="music-toggle" aria-pressed="false">Off</button>
      </div>
      <fieldset class="tracks" id="tracks">
        <legend class="visually-hidden">Song</legend>
      </fieldset>
      <label class="volume">Volume <input type="range" id="music-volume" min="0" max="100" step="1"></label>
    </section>
    <section class="sound-part" aria-labelledby="cats-title">
      <div class="sound-row">
        <h3 id="cats-title">Cat sounds</h3>
        <button type="button" class="tile switch" id="cats-toggle" aria-pressed="true">On</button>
      </div>
      <label class="volume">Volume <input type="range" id="cats-volume" min="0" max="100" step="1"></label>
    </section>
  </div>

  <dialog id="confirm" class="panel" aria-labelledby="confirm-text">
    <form method="dialog">
      <div class="pic" id="confirm-pic"></div>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" id="confirm-no" class="btn" autofocus></button>
        <button value="ok" id="confirm-yes" class="btn dark"></button>
      </div>
    </form>
  </dialog>

  <dialog id="rooms" class="picker panel" aria-labelledby="rooms-title">
    <form method="dialog">
      <h2 id="rooms-title">Choose a room</h2>
      <div class="room-grid" id="room-grid"></div>
      <div class="actions"><button value="" class="btn">Close</button></div>
    </form>
  </dialog>

  <dialog id="skies" class="picker panel" aria-labelledby="skies-title">
    <form method="dialog">
      <h2 id="skies-title">Choose the sky</h2>
      <div class="room-grid" id="sky-grid"></div>
      <div class="actions"><button value="" class="btn">Close</button></div>
    </form>
  </dialog>

  <script src="assets/vendor/pixi.min.js"></script>          <!-- PixiJS 8.22.0 -->
  <script type="module">
    // ------------------------------------------------------------------
    // Catalogue – every cat and object in the control bar
    // ------------------------------------------------------------------
    // `scale` is the on-screen pixel size on a desktop-width screen (halved on
    // phones). Cat 1 is drawn at twice the detail of the others, hence 2 vs 4.
    // Cat sheets are strips of square frames; the frame count comes from the
    // image size, so only the file names are listed here.
    const CAT_ANIMS = ['idle', 'run', 'sit', 'sleep', 'jump', 'attack'];
    const CATS = [
      { name: 'Cream cat', dir: 'cream', scale: 2, anims: [...CAT_ANIMS, 'happy'] },
      { name: 'Tiger cat', dir: 'tiger', scale: 4, anims: CAT_ANIMS },
      { name: 'Batman cat', dir: 'batman', scale: 4, anims: CAT_ANIMS },
      { name: 'Egyptian cat', dir: 'egyptian', scale: 4, anims: CAT_ANIMS },
      { name: 'Siamese cat', dir: 'siamese', scale: 4, anims: CAT_ANIMS },
      { name: 'Calico cat', dir: 'calico', scale: 4, anims: CAT_ANIMS },
      { name: 'Odd-eyed cat', dir: 'odd-eyed', scale: 4, anims: CAT_ANIMS },
    ];
    const catUrl = (cat, anim) => `assets/cats/${cat.dir}/${anim}.png`;

    // "frames per tick at 60 ticks/sec" (0.1 ≈ 6 fps)
    const ANIM_SPEED = { idle: 0.1, run: 0.22, sit: 0.07, sleep: 0.04, jump: 0.25, attack: 0.25, happy: 0.12 };

    // frame = [x, y, w, h] of the first frame; `frames` more follow every `stride` px.
    // kind = how cats use it (see USES below).
    const ITEM = 'assets/items/';
    const cells = (group, file, cols, size, names, props) => names.map((name, i) => ({
      group, name, src: ITEM + file, ...props,
      frame: [(i % cols) * size, Math.floor(i / cols) * size, size, size],
    }));
    // The room decorations sheet holds pictures of every size, so each one
    // is listed by name with its [x, y, w, h] on the sheet. Its pixels match
    // the room pictures, so scale 2 keeps them in proportion with the room.
    const DECOR = ITEM + 'decor/room-decorations.png';
    const decor = (group, props, list) => list.map(([name, frame]) => ({ group, name, src: DECOR, frame, scale: 2, ...props }));

    const ITEMS = [
      ...cells('Food', 'food/bowls.png', 2, 16, ['Green bowl', 'Blue bowl', 'Purple bowl', 'Red bowl'], { kind: 'bowl', scale: 3 }),
      ...cells('Food', 'food/fish.png', 2, 16, ['Blue fish', 'Orange fish', 'Silver fish', 'Yellow fish'], { kind: 'fish', scale: 3 }),
      ...cells('Food', 'food/cat-food.png', 1, 32, ['Bag of cat food'], { kind: 'bag', scale: 2 }),
      ...['Blue', 'Orange', 'Pink'].map(c => ({
        group: 'Toys', name: `${c} ball`, src: `${ITEM}toys/ball-${c.toLowerCase()}.png`, kind: 'ball', scale: 4, frame: [0, 0, 24, 16] })),
      { group: 'Toys', name: 'Toy mouse', src: ITEM + 'toys/mouse.png', kind: 'mouse', scale: 2, frame: [0, 0, 32, 32], frames: 4, stride: 42 },
      { group: 'Toys', name: 'Feather wand', src: ITEM + 'toys/feather-wand.png', kind: 'wand', scale: 3, frame: [0, 0, 32, 32], frames: 6 },
      ...['Blue', 'Brown', 'Green', 'Pink', 'Purple', 'Red'].flatMap(c =>
        cells('Beds', `beds/bed-${c.toLowerCase()}.png`, 1, 64, [`${c} bed`], { kind: 'bed', scale: 3, seat: 7 })),
      // `seat` = how far above its feet (in sheet pixels) a cat lies in the bed.
      ...decor('Beds', { kind: 'bed', seat: 24 }, [
        ['Blue cushion', [202, 138, 110, 82]], ['Grey cushion', [329, 138, 110, 82]],
        ['Red cushion', [202, 236, 110, 82]], ['Olive cushion', [329, 236, 110, 82]],
        ['Purple cushion', [202, 326, 110, 82]], ['Teal cushion', [329, 326, 110, 82]],
      ]),
      ...cells('Hideaways', 'beds/houses.png', 2, 63, ['Blue house', 'Green house', 'Purple house', 'Orange house'], { kind: 'hideout', scale: 3 }),
      ...cells('Hideaways', 'beds/carriers.png', 4, 64, ['Brown carrier', 'Purple carrier', 'Orange carrier', 'Red carrier',
        'Green carrier', 'Blue carrier', 'Black carrier', 'Navy carrier'], { kind: 'hideout', scale: 3 }),
      ...cells('Furniture', 'furniture/scratching-posts.png', 2, 64, ['Green scratcher', 'Blue scratcher', 'Purple scratcher', 'Red scratcher'], { kind: 'post', scale: 3 }),
      ...decor('Furniture', { kind: 'post' }, [
        ['Peach scratching post', [191, 17, 64, 110]], ['Olive scratching post', [287, 16, 64, 110]],
        ['Slate scratching post', [383, 16, 64, 110]],
      ]),
      // Plants are just for looks: cats walk around them.
      ...decor('Decor', { kind: 'decor' }, [
        ['Fig in a brown pot', [140, 299, 45, 108]], ['Fig in a navy pot', [140, 421, 45, 108]],
        ['Fig in a pink pot', [138, 552, 45, 108]], ['Fig in a blue pot', [138, 685, 45, 108]],
        ['Pink pot plant', [132, 193, 23, 29]], ['Grey pot plant', [164, 193, 23, 29]],
        ['Cream pot plant', [132, 226, 23, 29]], ['Mint pot plant', [164, 226, 23, 29]],
        ['Yellow pot plant', [132, 258, 23, 29]], ['Blue pot plant', [164, 258, 23, 29]],
      ]),
      // Shelves and tables: cats jump up on them. `perches` are the spots
      // they sit on, in the picture's pixels [x, y].
      ...decor('Decor', { kind: 'perch', perches: [[52, 26]] }, [
        ['Peach shelf', [14, 289, 100, 127]], ['Blue shelf', [12, 416, 100, 128]],
        ['Green shelf', [9, 544, 100, 128]], ['Purple shelf', [7, 673, 100, 127]],
        ['Wooden shelf', [7, 801, 100, 127]],
      ]),
      ...decor('Decor', { kind: 'perch', perches: [[30, 20]] }, [
        ['Cream table', [674, 610, 61, 61]], ['Grey table', [738, 610, 61, 61]],
        ['Pink table', [802, 610, 61, 61]], ['Teal table', [866, 610, 61, 61]],
        ['Lilac table', [930, 610, 61, 61]],
      ]),
    ];
    const CATALOG = [...CATS.map(c => ({ ...c, group: 'Cats', kind: 'cat' })), ...ITEMS];

    // Fixed scenery, not in the bar: the cat tree that makes the play area.
    // furniture/cat-tree-light.png is a paler version that also fits.
    // Its platform tops, in the picture's pixels [x, y].
    const PERCHES = [[16, 40], [52, 52], [104, 24], [72, 84]];
    const PLAY_TREE = cells('Play area', 'furniture/cat-tree.png', 1, 128, ['Cat tree'], { kind: 'tree', scale: 2, perches: PERCHES })[0];
    // …and a cushion bed at the other end, for cats out there to nap in.
    const PLAY_BED = decor('Play area', { kind: 'bed', seat: 24 }, [['Play-area bed', [202, 138, 110, 82]]])[0];
    const SCENERY = [PLAY_TREE, PLAY_BED];


    // ------------------------------------------------------------------
    // Room – one of the isometric room pictures, given a wooden floor and
    // decorated from the decorations sheet. The room types differ in wall
    // colour; each also picks its own curtains, blinds and portrait.
    // ------------------------------------------------------------------
    const ROOM_TYPES = ['Rose', 'Slate', 'Honey', 'Lilac', 'Sage', 'Teal', 'Pistachio', 'Stone',
      'Plum', 'Cocoa', 'Cloud', 'Sky', 'Periwinkle', 'Mint', 'Coral']
      .map((name, i) => ({ name, src: `assets/rooms/room-${String(i + 1).padStart(2, '0')}.png` }));
    const DEFAULT_ROOM = 0;

    // All room pictures share this layout, in picture pixels.
    const ROOM = {
      crop: [9, 27, 496, 436],                         // the opaque part of the picture
      floorSeed: [256, 330],                           // any pixel of the bare floor
      floor: { x: 262, y: 322, rx: 226, ry: 121 },     // floor diamond: centre and half-diagonals
      base: 2,                                         // catalogue scales assume the room drawn at 2×
    };

    // Light through the windows, in picture pixels: `sill` is the bottom
    // edge of the glass, `patch` the bright shape on the floor (the two
    // points under the sill, then the two far ones). The window with blinds
    // throws stripes.
    const WINDOW_LIGHT = [
      { sill: [[76, 271], [153, 234]], patch: [[92, 306], [169, 265], [259, 310], [182, 351]] },
      { sill: [[288, 190], [348, 216]], patch: [[272, 225], [332, 256], [252, 296], [192, 265]], stripes: 5 },
    ];

    // Hung on the walls: `at` is the top-left corner in picture pixels; room
    // type i uses frames[i % frames.length]. The sheet draws each piece for
    // one wall: curtains, the air vent and the painting face the left wall,
    // blinds and portraits the right.
    const WALL_DECOR = [
      { at: [70, 140], frames: [[674, 306, 93, 139], [770, 301, 93, 139], [866, 299, 93, 139]] },   // curtained window
      { at: [190, 130], frames: [[79, 226, 38, 62]] },                                                // painting
      { at: [285, 95], frames: [[864, 3, 64, 123], [928, 4, 64, 123], [864, 129, 64, 123], [928, 130, 64, 123]] },  // window with blinds
      { at: [375, 140], frames: [[714, 196, 39, 89]] },                                               // plant poster
      { at: [430, 175], frames: [[452, 200, 25, 46], [484, 201, 25, 46], [515, 200, 25, 46],
                                 [452, 264, 25, 46], [484, 265, 25, 46], [515, 264, 25, 46]] },        // cat portrait
    ];

    // Floorboards, in picture pixels: plank colours (picked per board), the
    // gap between boards, and how wide and long the boards are.
    const WOOD = {
      planks: [[196, 138, 90], [186, 126, 80], [205, 150, 102], [178, 120, 76]],
      seam: [132, 84, 52],
      width: 10,
      length: 40,
    };

    // The sky behind the room. By default it follows the viewer's clock: each
    // picture shows from the local hour `from` until the next one starts.
    // The Sky button can also pin one of them, or a plain dark backdrop.
    // `stars` is how starry it is (0 none, 1 full), for the twinkling stars;
    // `light` is the [colour, strength] of the light through the windows.
    const SKIES = [
      { name: 'Fajr', from: 4, src: 'assets/skies/fajr.png', stars: 0, light: [0xb8c6ff, 0.13] },          // before sunrise
      { name: 'Dawn', from: 6, src: 'assets/skies/dawn.png', stars: 0, light: [0xffc8a0, 0.16] },
      { name: 'Noon', from: 9, src: 'assets/skies/noon.png', stars: 0, light: [0xfff0c0, 0.22] },
      { name: 'Sunset', from: 17, src: 'assets/skies/sunset.png', stars: 0.45, light: [0xffa060, 0.20] },
      { name: 'Night', from: 20, src: 'assets/skies/night.png', stars: 1, light: [0x9ab8ff, 0.17] },
    ];
    const DARK_SKY = { name: 'Dark', src: '', stars: 1, light: null };
    const DEFAULT_SKY = 0;                                 // Fajr

    // Pixel effects: strips of square frames in assets/effects/, made from
    // the GIFs in source/effects/ by tools/build_effects.py. `at` is where they play on
    // whatever they're about: above its head, or over its middle.
    const EFFECTS = {
      hearts: { at: 'head' }, sparkle: { at: 'body' }, sleep: { at: 'head' }, smoke: { at: 'body' },
      alert: { at: 'head' }, scrap: { at: 'body' }, pounce: { at: 'body' }, music: { at: 'head' },
      party: { at: 'body' }, death: { at: 'body' },
    };
    const FX_SPEED = 0.25;                              // ≈ 15 fps, the speed the GIFs were made for
    // Pop-ups shown as a pixel effect; any other emoji floats up as text.
    const EMOTE_EFFECT = { '❤️': 'hearts', '✨': 'sparkle', '💤': 'sleep', '💨': 'smoke', '❗': 'alert',
                           '💢': 'scrap', '😋': 'music' };

    // What the room looks like at first. Positions are fractions of the
    // floor's width (left → right) and depth (back → front).
    const START = [
      ['Cream cat', .5, .55], ['Blue bowl', .3, .42], ['Blue bed', .72, .45],
      ['Blue ball', .42, .72], ['Green scratcher', .6, .3], ['Toy mouse', .3, .62],
      ['Fig in a brown pot', .44, .12], ['Cream table', .18, .58],
    ];

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------
    const rand = (min, max) => min + Math.random() * (max - min);
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const clampTo = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const every = (sec, fn) => { let t = sec; return dt => { if ((t -= dt) <= 0) { t = sec; fn(); } }; };
    const isOver = (el, ev) => {
      const r = el.getBoundingClientRect();
      return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    };

    // Cut `count` frames (w×h, every `stride` px to the right) out of a sheet.
    // Also finds the bounds of the opaque pixels across all frames so the
    // sprite can be anchored at its feet – centred on the body, bottom on the
    // lowest pixel. That keeps every animation standing on the same spot
    // instead of hopping around when it switches or flips direction.
    // Done once at load time, never per frame.
    function cut(texture, [x, y, w, h], count = 1, stride = w) {
      const img = texture.source.resource;
      const ctx = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height })
        .getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);

      let left = w, right = -1, top = h, bottom = -1;
      const textures = [];
      for (let i = 0; i < count; i++) {
        const fx = x + i * stride;
        textures.push(new PIXI.Texture({ source: texture.source, frame: new PIXI.Rectangle(fx, y, w, h) }));
        const { data } = ctx.getImageData(fx, y, w, h);
        for (let p = 0; p < w * h; p++) {
          if (!data[p * 4 + 3]) continue;
          const px = p % w, py = Math.floor(p / w);
          left = Math.min(left, px); right = Math.max(right, px);
          top = Math.min(top, py); bottom = Math.max(bottom, py);
        }
      }
      if (bottom < 0) [left, right, top, bottom] = [0, w - 1, 0, h - 1];   // fully transparent
      const foot = { x: (left + right + 1) / 2, y: bottom + 1 };
      return {
        textures, img, foot,
        anchor: { x: foot.x / w, y: foot.y / h },
        crop: [x + left, y + top, right - left + 1, bottom - top + 1],     // opaque part of frame 0
      };
    }

    // A small <canvas> picture of a catalogue entry, `k` CSS px per sprite px.
    function thumb(def, k) {
      const [x, y, w, h] = def.look.crop;
      const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
      c.getContext('2d').drawImage(def.look.img, x, y, w, h, 0, 0, w, h);
      c.style.width = `${w * k}px`;
      c.style.height = `${h * k}px`;
      if (k < 1) c.style.imageRendering = 'auto';           // shrinking: smooth beats jagged
      return c;
    }
    const fitScale = (def, box) => {
      const k = box / Math.max(def.look.crop[2], def.look.crop[3]);
      return k >= 1 ? Math.floor(k) : k;
    };

    // Integer hash: stable "random" picks, so the floorboards never shuffle.
    const hash = (a, b) => {
      let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return (h ^ (h >>> 16)) >>> 0;
    };

    // Paint floorboards over the bare floor of a room picture (in place).
    // The floor is found by flood-filling from ROOM.floorSeed through pixels
    // of nearly the same colour, so walls and edges are left alone.
    function layFloor(ctx, w, h) {
      const pic = ctx.getImageData(0, 0, w, h);
      const d = pic.data;
      const [sx, sy] = ROOM.floorSeed;
      const seed = (sy * w + sx) * 4;
      const near = p => d[p * 4 + 3] === 255 && Math.abs(d[p * 4] - d[seed]) <= 12 &&
        Math.abs(d[p * 4 + 1] - d[seed + 1]) <= 12 && Math.abs(d[p * 4 + 2] - d[seed + 2]) <= 12;
      const floor = new Uint8Array(w * h);
      const stack = [sy * w + sx];
      floor[stack[0]] = 1;
      while (stack.length) {
        const p = stack.pop(), x = p % w;
        for (const n of [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w]) {
          if (n >= 0 && n < w * h && !floor[n] && near(n)) { floor[n] = 1; stack.push(n); }
        }
      }

      // Boards run along the right-hand wall. In doubled isometric
      // coordinates, t = 2y − x stays the same along a board and s = 2y + x
      // runs along it; each row of boards starts at a different offset.
      const across = WOOD.width * 2, along = WOOD.length * 2;
      for (let p = 0; p < w * h; p++) {
        if (!floor[p]) continue;
        const x = p % w, y = (p - x) / w;
        const t = 2 * y - x, row = Math.floor(t / across), inRow = t - row * across;
        const s = 2 * y + x + hash(row, 7) % along, board = Math.floor(s / along);
        let [r, g, b] = WOOD.planks[hash(row, board) % WOOD.planks.length];
        if (inRow < 2 || s - board * along < 2) [r, g, b] = WOOD.seam;           // gap between boards
        else if (inRow >> 1 === (WOOD.width >> 1) - 1 && hash(board, s / 6 | 0) % 3 === 0) {
          r -= 14; g -= 14; b -= 14;                                               // grain down the middle
        }
        const wall = [1, 2, 3].find(k => !floor[p - k * w]);                      // shade the foot of the walls
        const shade = wall ? 0.72 + 0.08 * wall : 1;
        d[p * 4] = r * shade;
        d[p * 4 + 1] = g * shade;
        d[p * 4 + 2] = b * shade;
      }
      ctx.putImageData(pic, 0, 0);
    }

    // The full picture for room type i: wooden floor, then the wall decorations.
    function buildRoom(i) {
      const img = art[ROOM_TYPES[i].src];
      const canvas = Object.assign(document.createElement('canvas'), { width: img.width, height: img.height });
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      layFloor(ctx, img.width, img.height);
      for (const { at: [x, y], frames } of WALL_DECOR) {
        const [fx, fy, fw, fh] = frames[i % frames.length];
        ctx.drawImage(art[DECOR], fx, fy, fw, fh, x, y, fw, fh);
      }
      return canvas;
    }

    // A small, smoothly shrunk copy of a room picture, `cssW` CSS px wide.
    function roomThumb(canvas, cssW) {
      const [x, y, w, h] = ROOM.crop;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const c = Object.assign(document.createElement('canvas'),
        { width: Math.round(cssW * dpr), height: Math.round((cssW * h / w) * dpr) });
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(canvas, x, y, w, h, 0, 0, c.width, c.height);
      return c;
    }

    function showError(err) {
      console.error(err);
      const el = document.createElement('div');
      el.style.cssText =
        'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
        'padding:24px;text-align:center;color:#f2f2f7;background:#1b1b24;font:16px/1.5 system-ui,sans-serif;';
      el.textContent = location.protocol === 'file:'
        ? 'Images can\'t load when this page is opened straight from disk. Serve the folder with a local server (e.g. VS Code Live Server, "npx serve", or "python -m http.server") and open it via http://localhost.'
        : `${err.message}. Check that the image files are in the "sprite" folder and match the names in the catalogue.`;
      document.body.appendChild(el);
    }

    // ------------------------------------------------------------------
    // App + loading
    // ------------------------------------------------------------------
    const sceneEl = document.getElementById('scene');
    const paletteEl = document.getElementById('palette');
    const trashEl = document.getElementById('trash');
    const confirmDialog = document.getElementById('confirm');
    const roomsDialog = document.getElementById('rooms');
    const roomGrid = document.getElementById('room-grid');
    const skiesDialog = document.getElementById('skies');
    const skyGrid = document.getElementById('sky-grid');

    PIXI.TextureStyle.defaultOptions.scaleMode = 'nearest';    // crisp pixel art everywhere

    const app = new PIXI.Application();
    await app.init({
      resizeTo: sceneEl,
      backgroundAlpha: 0,                                 // the floor is drawn by CSS
      antialias: false,
      autoDensity: true,
      resolution: Math.min(window.devicePixelRatio || 1, 2),
      roundPixels: true,
      powerPreference: 'high-performance',
    });
    sceneEl.appendChild(app.canvas);
    new ResizeObserver(() => app.queueResize()).observe(sceneEl);

    const art = {};                                     // url → loaded image, for drawing on canvases

    async function loadArt() {
      const defs = [...CATALOG, ...SCENERY];
      const urlsOf = d => d.kind === 'cat' ? d.anims.map(anim => catUrl(d, anim)) : [d.src];
      const fxUrl = name => `assets/effects/${name}.png`;
      const urls = [...new Set([...defs.flatMap(urlsOf), ...ROOM_TYPES.map(r => r.src), ...Object.keys(EFFECTS).map(fxUrl), 'assets/ui/bubble.png'])];
      // The name tags are drawn in the page's pixel font, so wait for it (but not forever, or if offline).
      const font = Promise.race([document.fonts.load('600 14px "Pixelify Sans"'), new Promise(r => setTimeout(r, 3000))]).catch(() => {});
      const [tex] = await Promise.all([PIXI.Assets.load(urls), font]);
      for (const url of urls) art[url] = tex[url].source.resource;
      bubbleTexture = tex['assets/ui/bubble.png'];
      for (const [name, effect] of Object.entries(EFFECTS)) {
        const t = tex[fxUrl(name)];
        effect.textures = cut(t, [0, 0, t.height, t.height], Math.round(t.width / t.height)).textures;
      }
      for (const d of defs) {
        if (d.kind !== 'cat') { d.look = cut(tex[d.src], d.frame, d.frames, d.stride); continue; }
        d.anim = {};
        for (const name of d.anims) {
          const t = tex[catUrl(d, name)];
          d.anim[name] = cut(t, [0, 0, t.height, t.height], Math.round(t.width / t.height));
        }
        d.look = d.anim.idle;
      }
    }

    // ------------------------------------------------------------------
    // Scene + entities
    // ------------------------------------------------------------------
    // Every cat and object is an entity standing on the floor at (x, y) – its
    // feet. `lift` raises the picture without moving it on the floor (a ball's
    // hop, a cat up the cat tree) and things further down the screen are drawn
    // in front.
    const entities = [];
    const room = new PIXI.Sprite();
    const windowLight = new PIXI.Graphics({ blendMode: 'add' });   // drawn in room picture pixels
    const ground = new PIXI.Graphics();                  // the play area's strip
    const shadows = new PIXI.Container();
    const world = new PIXI.Container({ sortableChildren: true });
    const labels = new PIXI.Container();                 // cats' name tags
    const fx = new PIXI.Container();
    const talk = new PIXI.Container();                   // speech bubbles
    const starLayer = new PIXI.Container();              // twinkling stars (see Stars)
    const shooter = new PIXI.Graphics();                 // the shooting star
    app.stage.addChild(starLayer, shooter, room, windowLight, ground, shadows, world, labels, fx, talk);
    const shadowShape = new PIXI.GraphicsContext().ellipse(0, 0, 1, 0.3).fill({ color: 0x000000, alpha: 0.25 });
    const HAS_SHADOW = new Set(['cat', 'ball', 'mouse']);

    // While something is carried, it floats a little and a shadow marks
    // where it will land. The marker is drawn over everything except the
    // carried thing itself, so it can't be lost behind furniture.
    const HELD_LIFT = 16;                                 // px at 2× room zoom
    const dropMarker = new PIXI.Graphics({ zIndex: 1e9 - 1, visible: false });
    world.addChild(dropMarker);
    function markDrop(x, y, half) {
      const rx = Math.max(10, half * 0.8), ry = rx * 0.32;
      dropMarker.clear()
        .ellipse(0, 0, rx, ry).fill({ color: 0x000000, alpha: 0.3 })
        .ellipse(0, 0, rx, ry).stroke({ color: 0xf6e8d6, alpha: 0.9, width: 2 });
      dropMarker.position.set(Math.round(x), Math.round(y));
      dropMarker.visible = true;
    }
    const hideDrop = () => { dropMarker.visible = false; };

    // The room is drawn as big as fits: picture pixel (px, py) lands on
    // (view.x + px·k, view.y + py·k), and everything else is sized to match.
    const view = { k: ROOM.base, x: 0, y: 0 };
    const unit = () => view.k / ROOM.base;
    const sizeOf = def => Math.max(1, Math.round(def.scale * unit()));

    // The play area: a strip of ground along the bottom of the screen where
    // cats' feet can go, with the cat tree at its left end.
    const yard = { x0: 0, x1: 1, y0: 0, y1: 1 };
    const YARD_STRIP = { share: 0.15, min: 64, max: 120 };     // strip height: share of the scene, within px limits

    function layout() {
      const { width, height } = app.screen;
      const [cx, cy, cw, ch] = ROOM.crop;
      const strip = clampTo(height * YARD_STRIP.share, YARD_STRIP.min, YARD_STRIP.max);
      const zoomFor = h => {
        const best = Math.min(width / cw, h / ch) * 0.96;
        // A whole-number zoom keeps the pixel art crisp; only give that up when it would shrink the room a lot.
        return Math.floor(best) >= 1 && Math.floor(best) / best > 0.85 ? Math.floor(best) : best;
      };
      // The room sits above the strip. If the cat tree wouldn't fit beside
      // it, the room also clears the tree's height.
      let above = height - strip;
      let k = zoomFor(above);
      const treeScale = Math.max(1, Math.round(PLAY_TREE.scale * k / ROOM.base));
      const [, , tw, th] = PLAY_TREE.look.crop;
      if ((width - cw * k) / 2 < tw * treeScale + 16) {
        above = height - Math.max(strip, th * treeScale + 8);
        k = zoomFor(above);
      }
      const x = Math.round((width - cw * k) / 2 - cx * k);
      const y = Math.round((above - ch * k) / 2 - cy * k);
      const next = { x0: 8, x1: width - 8, y0: height - strip + 14, y1: height - 6 };

      // Carry everything over, so it keeps its place in the room or the play area.
      const r = k / view.k;
      const inRoom = (px, py) => [x + (px - view.x) * r, y + (py - view.y) * r];
      const inYard = (px, py) => [
        next.x0 + ((px - yard.x0) / (yard.x1 - yard.x0 || 1)) * (next.x1 - next.x0),
        next.y0 + ((py - yard.y0) / (yard.y1 - yard.y0 || 1)) * (next.y1 - next.y0),
      ];
      for (const e of entities) {
        const move = e.zone === 'yard' ? inYard : inRoom;
        [e.x, e.y] = move(e.x, e.y);
        if (e.tx !== undefined) [e.tx, e.ty] = move(e.tx, e.ty);
        e.vx *= r;
        e.vy *= r;
        e.lift *= r;
      }
      Object.assign(view, { k, x, y });
      Object.assign(yard, next);
      room.position.set(x, y);
      room.scale.set(k);
      windowLight.position.set(x, y);
      windowLight.scale.set(k);
      ground.clear()
        .roundRect(4, yard.y0 - 18, width - 8, height - yard.y0 + 14, 12).fill({ color: 0xf6e8d6, alpha: 0.35 })
        .roundRect(4, yard.y0 - 18, width - 8, height - yard.y0 + 14, 12).stroke({ color: 0x403939, alpha: 0.25, width: 2 });
      for (const e of entities) { fit(e); clamp(e); }
      placeScenery();
      makeStars();
    }

    // The tree stands at the play area's left end, the bed at its right end.
    // The signature (CSS) sits just above the strip, or above the bed if
    // that's taller.
    function placeScenery() {
      let clear = app.screen.height - yard.y0 + 18;
      for (const e of entities) {
        if (e.def === PLAY_TREE) Object.assign(e, { x: yard.x0 + e.half + 8, y: yard.y1 });
        if (e.def === PLAY_BED) {
          Object.assign(e, { x: yard.x1 - e.half - 8, y: yard.y1 });
          clear = Math.max(clear, app.screen.height - (e.y - e.tall) + 6);
        }
      }
      document.documentElement.style.setProperty('--yard-strip', `${Math.round(clear)}px`);
    }

    // Where (x, y) lands for entity e in its area (or `zone`): on the room's
    // floor, or within the play area's strip. Also says which floor edges it
    // was pushed back from (see onFloor).
    function stand(e, x, y, zone = e.zone) {
      if (zone !== 'yard') return onFloor(x, y, margin(e));
      const pad = e.half * 0.5;
      return { x: clampTo(x, yard.x0 + pad, yard.x1 - pad), y: clampTo(y, yard.y0, yard.y1), hp: 0, hq: 0 };
    }
    // Somewhere random for e to go in its area.
    function spotFor(e) {
      if (e.zone !== 'yard') return randomSpot(margin(e));
      const pad = e.half * 0.5;
      return { x: rand(yard.x0 + pad, yard.x1 - pad), y: rand(yard.y0, yard.y1) };
    }

    // The floor is a diamond. In the coordinates p = u + v, q = u − v (where
    // u, v are the offset from its centre in half-diagonals) it is the square
    // |p|, |q| ≤ 1, which makes staying on it and bouncing off its edges easy.
    // p runs from the left wall to the front-right edge, q from the front-left
    // edge to the right wall.
    function floorBox() {
      const { x, y, rx, ry } = ROOM.floor;
      return { x: view.x + x * view.k, y: view.y + y * view.k, rx: rx * view.k, ry: ry * view.k };
    }
    const toFloor = (f, x, y) => { const u = (x - f.x) / f.rx, v = (y - f.y) / f.ry; return [u + v, u - v]; };
    const fromFloor = (f, p, q) => [f.x + ((p + q) / 2) * f.rx, f.y + ((p - q) / 2) * f.ry];
    // How far in from the edges (in p, q units) something's feet must stay.
    // Only a quarter of its half-width: things can stand right up against a
    // wall or the front edge, with a little overhang, like real furniture.
    const margin = e => Math.min(0.3, (e.half * 0.25) / (ROOM.floor.rx * view.k));

    // Pull (x, y) onto the floor, `m` in from its edges. hp / hq say which
    // edges it was pushed back from: −1 or +1, 0 for neither.
    function onFloor(x, y, m = 0) {
      const f = floorBox(), [p, q] = toFloor(f, x, y), lim = 1 - m;
      const hp = p > lim ? 1 : p < -lim ? -1 : 0;
      const hq = q > lim ? 1 : q < -lim ? -1 : 0;
      if (hp || hq) [x, y] = fromFloor(f, hp ? hp * lim : p, hq ? hq * lim : q);
      return { x, y, hp, hq };
    }
    function randomSpot(m = 0) {
      const [x, y] = fromFloor(floorBox(), rand(m - 1, 1 - m), rand(m - 1, 1 - m));
      return { x, y };
    }

    // `fixed` scenery can't be picked up or thrown away.
    function spawn(def, x, y, { zone = 'room', fixed = false } = {}) {
      const sprite = new PIXI.AnimatedSprite(def.look.textures);
      sprite.anchor.copyFrom(def.look.anchor);
      sprite.eventMode = 'static';
      sprite.cursor = fixed ? 'pointer' : 'grab';
      const e = { def, kind: def.kind, sprite, x, y, zone, fixed, lift: 0, z: 0, vx: 0, vy: 0,
                  dir: def.kind === 'cat' && Math.random() < 0.5 ? -1 : 1 };
      sprite.on('pointerdown', ev => startDrag({ e }, ev));
      world.addChild(sprite);
      if (HAS_SHADOW.has(def.kind)) shadows.addChild(e.shadow = new PIXI.Graphics(shadowShape));
      fit(e);
      clamp(e);
      entities.push(e);
      INIT[def.kind]?.(e);
      return e;
    }

    const INIT = {
      cat: c => {
        c.needs = { hunger: rand(.2, .5), tired: rand(0, .3), bored: rand(.4, .7), lonely: rand(0, .3) };
        c.speed = rand(...CAT_SPEED);
        c.name = freshName();
        c.chat = rand(1, 8);
        c.voice = rand(0.88, 1.18);                      // pitch of its meows
        c.tag = new PIXI.Text({ text: c.name, style: TAG_STYLE, anchor: { x: 0.5, y: 0 } });
        labels.addChild(c.tag);
        act(c, 'idle', rand(1, 2));
      },
      bowl: b => setFood(b, 3),
      mouse: m => { m.sprite.animationSpeed = 0.25; m.time = 0; m.stun = 0; m.heading = rand(0, Math.PI * 2); },
      wand: w => { w.sprite.animationSpeed = 0.2; w.wiggle = 0; },
      ball: b => { b.hop = 0; },
    };

    // `quiet`: no puff of smoke (it already had its own send-off).
    function remove(e, quiet = false) {
      if (e.dead) return;
      e.dead = true;
      entities.splice(entities.indexOf(e), 1);
      if (e.kind === 'cat') settle(e);
      else if (e.user) think(e.user);            // whoever was using it finds something else to do
      if (!quiet) emote(e, '💨');
      if (e === menuCat) catMenu.hidePopover();
      unlink(e);
    }

    // Free an entity's display objects.
    function unlink(e) {
      e.sprite.destroy();
      e.shadow?.destroy();
      e.tag?.destroy();
      e.bubble?.view.destroy({ children: true });
    }

    // Size and on-screen extents; re-run when the room is resized.
    function fit(e) {
      const [, , w, h] = e.def.look.crop;
      e.s = sizeOf(e.def);
      e.half = (w * e.s) / 2;
      e.tall = h * e.s;
      e.shadow?.scale.set(e.half * 0.8);
    }

    // Keep an entity within its area; returns which edges it hit (see onFloor).
    function clamp(e) {
      const at = stand(e, e.x, e.y);
      e.x = at.x;
      e.y = at.y;
      return at;
    }

    function draw(e) {
      const up = held(e);
      e.sprite.position.set(e.x, e.y - e.lift - (up ? HELD_LIFT * unit() : 0));
      e.sprite.scale.set(e.dir * e.s, e.s);
      e.sprite.zIndex = up ? 1e9 : e.fixed ? -1e9 : e.y + e.z;   // scenery is always at the back
      if (e.shadow) {
        e.shadow.position.set(e.x, e.y);
        e.shadow.visible = e.sprite.visible;
        e.shadow.alpha = clampTo(1 - e.lift / (120 * unit()), 0.35, 1);   // fainter the higher it is
      }
      if (e.tag) {
        e.tag.position.set(e.x, e.y - e.lift + 2);
        e.tag.visible = e.sprite.visible && !up;
      }
    }

    // Cats get a name when they arrive; it shows on a tag under their feet.
    const CAT_NAMES = ['Mochi', 'Luna', 'Biscuit', 'Pumpkin', 'Tofu', 'Miso', 'Pepper', 'Nala', 'Oreo', 'Ginger',
      'Cleo', 'Milo', 'Willow', 'Peanut', 'Sushi', 'Bean', 'Toast', 'Maple', 'Pickle', 'Noodle', 'Waffle', 'Olive'];
    // The first cats to arrive get these, in order (Coco starts in the room).
    const FIRST_NAMES = ['Coco', 'Moose'];
    let catsArrived = 0;
    function freshName() {
      const first = FIRST_NAMES[catsArrived++];
      if (first) return first;
      const taken = new Set(entities.filter(e => e.kind === 'cat').map(c => c.name));
      return pick(CAT_NAMES.filter(n => !taken.has(n) && !FIRST_NAMES.includes(n))) ?? pick(CAT_NAMES);
    }
    const TAG_STYLE = new PIXI.TextStyle({
      fontFamily: ['Pixelify Sans', 'system-ui', 'sans-serif'], fontSize: 14, fontWeight: '600',
      fill: '#f6e8d6', stroke: { color: '#403939', width: 4, join: 'round' },
    });

    function rename(cat, name) {
      cat.name = cat.tag.text = name;
    }

    // Speech bubbles: a stretched bubble from the UI sheet with a line of
    // text, floating above the speaker's head with the tail pointing at it.
    // One at a time per speaker; it follows them and fades out.
    const BUBBLE = { slices: { leftWidth: 3, topHeight: 3, rightWidth: 10, bottomHeight: 6 }, tail: 6, scale: 2, time: 2.4 };
    const BUBBLE_STYLE = new PIXI.TextStyle({
      fontFamily: ['Pixelify Sans', 'system-ui', 'sans-serif'], fontSize: 15, fontWeight: '600', fill: '#403939',
    });
    // What cats say, by mood; `chat` when nothing in particular is up.
    const LINES = {
      chat: ['Meow', 'Mew', 'Mrrp', 'Purr~', 'Nya~', 'Mrow?', 'Prrt!'],
      hunger: ['Feed me!', 'Hungry…', 'Meooow!'],
      tired: ['*yawn*', 'Sleepy…'],
      bored: ['Play?', 'Bored…', 'Mrrp?'],
      lonely: ['Mew?', 'Anyone?'],
    };
    let bubbleTexture = null;

    function say(e, text, time = BUBBLE.time) {
      e.bubble?.view.destroy({ children: true });
      const view = new PIXI.Container();
      const label = new PIXI.Text({ text, style: BUBBLE_STYLE });
      const k = BUBBLE.scale;
      const frame = new PIXI.NineSliceSprite({
        texture: bubbleTexture, ...BUBBLE.slices,
        width: Math.ceil((label.width + 18) / k), height: Math.ceil((label.height + 8) / k) + BUBBLE.tail,
      });
      frame.scale.set(k);
      label.position.set(9, 4);
      view.addChild(frame, label);
      // The tail's tip, near the bubble's bottom right, sits just above the head.
      view.pivot.set(frame.width * k - 6 * k, frame.height * k);
      talk.addChild(view);
      e.bubble = { view, age: 0, time };
      if (e.kind === 'cat') voice(e, text);
    }

    function updateBubbles(dt) {
      for (const e of entities) {
        const b = e.bubble;
        if (!b) continue;
        b.age += dt;
        if (b.age >= b.time || !e.sprite.visible) {
          b.view.destroy({ children: true });
          e.bubble = null;
          continue;
        }
        b.view.position.set(Math.round(e.x + e.half * 0.4), Math.round(e.y - e.lift - e.tall * 0.85));
        b.view.alpha = Math.min(1, (b.time - b.age) / 0.3);
      }
    }

    // Now and then an awake cat says something about how it's feeling.
    function chatter(cat, dt) {
      if ((cat.chat -= dt) > 0) return;
      cat.chat = rand(7, 16);
      if (cat.anim === 'sleep' || !cat.sprite.visible || held(cat) || cat === menuCat) return;
      const need = Object.keys(cat.needs).filter(k => cat.needs[k] > URGENT).sort((a, b) => cat.needs[b] - cat.needs[a])[0];
      say(cat, pick(LINES[need] ?? LINES.chat));
    }

    // Play a pixel effect once at (x, y), then throw it away.
    function effectAt(name, x, y) {
      const { textures, at } = EFFECTS[name];
      const sprite = new PIXI.AnimatedSprite({ textures, loop: false, animationSpeed: FX_SPEED });
      sprite.anchor.set(0.5, at === 'head' ? 1 : 0.5);
      sprite.scale.set(Math.max(1, Math.round(2 * unit())));
      sprite.position.set(x, y);
      sprite.eventMode = 'none';
      sprite.onComplete = () => sprite.destroy();
      fx.addChild(sprite);
      sprite.play();
    }

    // A pop-up above an entity (❤️ 💤 ❗ …): a pixel effect where there is
    // one, otherwise the emoji floating up.
    const emotes = [];
    const EMOTE_STYLE = new PIXI.TextStyle({ fontSize: 22 });
    function emote(e, text) {
      const name = EMOTE_EFFECT[text];
      if (name) {
        const top = e.y - e.lift - e.tall;
        return effectAt(name, e.x, EFFECTS[name].at === 'head' ? top : top + e.tall / 2);
      }
      const t = new PIXI.Text({ text, style: EMOTE_STYLE, anchor: 0.5 });
      t.position.set(e.x, e.y - e.lift - e.tall - 8);
      fx.addChild(t);
      emotes.push({ t, age: 0 });
    }
    function updateEmotes(dt) {
      for (let i = emotes.length - 1; i >= 0; i--) {
        const m = emotes[i];
        m.age += dt;
        m.t.y -= 28 * dt;
        m.t.alpha = Math.max(0, 1 - m.age / 1.5);
        if (m.age >= 1.5) { m.t.destroy(); emotes.splice(i, 1); }
      }
    }

    const nearest = (from, list, jitter = 0) => {
      let best = null, bestD = Infinity;
      for (const e of list) {
        const d = Math.hypot(e.x - from.x, e.y - from.y) * (1 + Math.random() * jitter);
        if (d < bestD) { best = e; bestD = d; }
      }
      return best;
    };
    const face = (a, b) => { if (Math.abs(b.x - a.x) > 1) a.dir = Math.sign(b.x - a.x); };
    const besideX = (cat, item) => item.x + (cat.x < item.x ? -1 : 1) * (item.half + cat.half * 0.4);

    // ------------------------------------------------------------------
    // Cat brain
    // ------------------------------------------------------------------
    // Needs run from 0 (content) to 1 (desperate) and creep up every second.
    // Whenever a cat finishes something it serves its most pressing need with
    // the nearest suitable object (or another cat), otherwise it wanders and
    // lounges. A cat is always either acting (an animation for a while) or
    // moving (to a spot, or chasing something), then runs `next`.
    const NEED_RATE = { hunger: 1 / 100, tired: 1 / 140, bored: 1 / 30, lonely: 1 / 60 };
    const URGENT = 0.5;                                  // a need above this gets seen to first

    // Movement, in px (at 2× room zoom) and seconds.
    const CAT_SPEED = [290, 360];                        // each cat's own top speed is picked from this
    const ACCEL = 1400;                                  // how hard cats speed up and brake
    const TURN = 9;                                      // how quickly they swing round to a new heading
    const LEAP = 130;                                    // a chasing cat leaps at the mouse from this close
    const relieve = (cat, need, amount) => { cat.needs[need] = Math.max(0, cat.needs[need] - amount); };

    // How cats use each kind of object. solo = one cat at a time,
    // chase = it moves so the cat follows it, spot = where to stand.
    const USES = {
      bowl:    { need: 'hunger', solo: true, ok: b => b.food > 0, use: eat },
      fish:    { need: 'hunger', solo: true, use: eat },
      bed:     { need: 'tired', solo: true, spot: (cat, bed) => bed.x,
                 use: (cat, bed) => { cat.lift = bed.def.seat * bed.s; cat.z = 1; nap(cat); } },
      hideout: { need: 'tired', solo: true, spot: (cat, home) => home.x, use: hide },
      post:    { need: 'bored', solo: true, use: cat => {
                 playSound('scratch', { rate: cat.voice, length: 2.8 });
                 act(cat, 'attack', 3, () => relieve(cat, 'bored', 0.5));
               } },
      wand:    { need: 'bored', solo: true, use: cat => act(cat, 'attack', 3.5, () => relieve(cat, 'bored', 0.6)) },
      tree:    { need: 'bored', solo: true, use: climb, spot: perchSpot },
      perch:   { need: 'bored', solo: true, use: climb, spot: perchSpot },
      ball:    { need: 'bored', chase: true, use: kick },
      mouse:   { need: 'bored', chase: true, use: pounce },
    };

    function usable(item, cat) {
      const how = USES[item.kind];
      return !!how && !held(item) && !item.dying && !(how.solo && item.user && item.user !== cat) && (how.ok?.(item) ?? true);
    }
    // Awake, on the floor and not tied up with an object.
    const free = c => c.kind === 'cat' && !held(c) && c.sprite.visible && c.anim !== 'sleep' && !c.using;

    function play(cat, name) {
      const a = cat.def.anim[name] ?? cat.def.anim.idle;
      cat.anim = name;
      cat.sprite.textures = a.textures;
      cat.sprite.anchor.copyFrom(a.anchor);
      cat.sprite.animationSpeed = ANIM_SPEED[name];
      cat.sprite.gotoAndPlay(0);
    }

    function act(cat, anim, time, next = null, tick = null) {
      Object.assign(cat, { mode: 'act', time, next, tick, vx: 0, vy: 0 });
      play(cat, anim);
    }

    // Run to (x, y), or after `follow` if given, then do `next`. `rush`
    // scales the cat's speed (zoomies, chasing).
    function goTo(cat, x, y, next = null, follow = null, rush = 1) {
      const to = stand(cat, x, y);
      Object.assign(cat, { mode: 'move', time: 12, next, tick: null, follow, rush, leaping: false, tx: to.x, ty: to.y });
      if (cat.anim !== 'run') play(cat, 'run');
    }

    // Let go of whatever the cat was doing.
    function settle(cat) {
      if (cat.using) cat.using.user = null;
      cat.using = cat.follow = cat.next = cat.tick = null;
      cat.lift = cat.z = 0;
      if (!cat.sprite.visible) {                     // step out of a hideaway
        cat.sprite.visible = true;
        cat.y += 8 * unit();
        clamp(cat);
      }
    }

    function think(cat) {
      settle(cat);
      const urgent = Object.keys(cat.needs).filter(k => cat.needs[k] > URGENT)
        .sort((a, b) => cat.needs[b] - cat.needs[a]);
      for (const need of urgent) if (pursue(cat, need)) return;
      pickWeighted(PASTIMES, cat)(cat);
    }

    // What a content cat does next, with how likely each is.
    const PASTIMES = [
      [5, cat => { const to = spotFor(cat); goTo(cat, to.x, to.y, () => act(cat, pick(['idle', 'sit']), rand(0.6, 1.8))); }],
      [3, cat => act(cat, pick(['idle', 'sit', 'sit']), rand(1.2, 3))],
      [2, sniff],
      [cat => perchesFor(cat).length ? 2 : 0, cat => use(cat, pick(perchesFor(cat)))],
      [cat => 1 + cat.needs.bored * 3, zoomies],
      [cat => entities.some(c => c !== cat && free(c) && c.zone === cat.zone) ? 1.5 : 0, tag],
      [1, cat => act(cat, cat.def.anim.happy && Math.random() < 0.5 ? 'happy' : 'jump', 0.9)],
    ];
    function pickWeighted(list, cat) {
      const weights = list.map(([w]) => (typeof w === 'function' ? w(cat) : w));
      let r = Math.random() * weights.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) if ((r -= weights[i]) < 0) return list[i][1];
      return list[0][1];
    }

    // Wander over to something in the room and give it a sniff.
    function sniff(cat) {
      const thing = pick(entities.filter(e => e !== cat && e.zone === cat.zone && !held(e) && e.sprite.visible));
      if (!thing) return act(cat, 'sit', 1.5);
      goTo(cat, besideX(cat, thing), thing.y + 1, () => { face(cat, thing); act(cat, 'sit', rand(0.8, 1.6)); });
    }

    // A burst of racing round the room.
    function zoomies(cat) {
      let laps = 2 + Math.floor(Math.random() * 3);
      const lap = () => {
        if (laps-- <= 0) return act(cat, 'sit', rand(1, 2));
        const to = spotFor(cat);
        goTo(cat, to.x, to.y, lap, null, 1.7);
      };
      relieve(cat, 'bored', 0.25);
      lap();
    }

    // Run at another cat; when caught, they play-fight or cuddle (greet).
    function tag(cat) {
      const friend = pick(entities.filter(c => c !== cat && free(c) && c.zone === cat.zone));
      if (!friend) return act(cat, 'sit', 1);
      goTo(cat, friend.x, friend.y, () => greet(cat, friend), friend, 1.3);
    }

    function pursue(cat, need, insist = false) {
      if (need === 'lonely') {
        const friend = nearest(cat, entities.filter(c => c !== cat && free(c) && c.zone === cat.zone));
        if (!friend) return false;
        goTo(cat, friend.x, friend.y, () => greet(cat, friend), friend);
        return true;
      }
      if (need === 'hunger') {                                   // a hungry cat goes after the mouse first
        const prey = nearest(cat, entities.filter(e => e.kind === 'mouse' && e.zone === cat.zone && usable(e, cat)));
        if (prey) {
          settle(cat);
          say(cat, pick(['Dinner!', 'Snack!', 'Mouse!']));
          goTo(cat, prey.x, prey.y, () => pounce(cat, prey, true), prey, 1.25);
          return true;
        }
      }
      const item = nearest(cat, entities.filter(e => e.zone === cat.zone && USES[e.kind]?.need === need && usable(e, cat)), 0.5);
      if (item) use(cat, item);
      else if (need === 'tired' && perchesFor(cat).length && Math.random() < 0.5) use(cat, pick(perchesFor(cat)));   // nap up high
      else if (need === 'tired') nap(cat);                       // no bed free: curl up on the floor
      else if (need === 'hunger' && (insist || Math.random() < 0.5)) {   // no food: beg by an empty bowl
        const bowl = nearest(cat, entities.filter(e => e.kind === 'bowl' && e.zone === cat.zone && !held(e)));
        if (!bowl) return false;
        goTo(cat, besideX(cat, bowl), bowl.y + 1, () => { face(cat, bowl); say(cat, 'Feed me!'); act(cat, 'sit', 3); });
      } else return false;
      return true;
    }

    function use(cat, item) {
      settle(cat);
      const how = USES[item.kind];
      if (how.solo) { item.user = cat; cat.using = item; }
      if (how.chase) return goTo(cat, item.x, item.y, () => how.use(cat, item), item, 1.25);
      const x = how.spot ? how.spot(cat, item) : besideX(cat, item);
      goTo(cat, x, item.y + 1, () => { face(cat, item); how.use(cat, item); });
    }

    function eat(cat, food) {
      act(cat, 'sit', 3, () => {
        emote(cat, '😋');
        if (food.kind === 'fish') {
          relieve(cat, 'hunger', 0.6);
          remove(food);
        } else {
          relieve(cat, 'hunger', 0.8);
          setFood(food, food.food - 1);
        }
      });
    }

    function setFood(bowl, n) {
      bowl.food = n;
      bowl.sprite.tint = n > 0 ? 0xffffff : 0x55556a;     // greyed out = empty
    }

    const nap = cat => act(cat, 'sleep', 6 + cat.needs.tired * 12, () => { cat.needs.tired = 0; });

    function hide(cat, home) {
      cat.sprite.visible = false;
      act(cat, 'sleep', 6 + cat.needs.tired * 12, () => { cat.needs.tired = 0; }, every(3, () => emote(home, '💤')));
    }

    // Pick one of the item's perches; returns where on the floor to jump from.
    function perchSpot(cat, item) {
      cat.perch = pick(item.def.perches);
      return item.x + (cat.perch[0] - item.def.look.foot.x) * item.s;
    }
    // Free things to climb near the cat.
    const perchesFor = cat => entities.filter(e => e.zone === cat.zone && (e.kind === 'perch' || e.kind === 'tree') && usable(e, cat));

    // Jump up onto a perch (cat tree, shelf, table), sit or nap up there,
    // then jump down. A tired cat naps; a high spot is a cat's favourite.
    function climb(cat, item) {
      const height = (item.def.look.foot.y - cat.perch[1]) * item.s;
      const rise = speed => dt => { cat.lift = clampTo(cat.lift + speed * dt, 0, height); };
      const down = () => act(cat, 'jump', 0.5, () => { cat.lift = 0; }, rise(-height / 0.5));
      const sleepy = cat.needs.tired > URGENT;
      act(cat, 'jump', 0.5, () => {
        if (sleepy) return act(cat, 'sleep', rand(6, 10), () => { cat.needs.tired = 0; down(); });
        act(cat, 'sit', rand(4, 7), () => {
          relieve(cat, 'bored', 0.4);
          relieve(cat, 'tired', 0.2);
          down();
        });
      }, rise(height / 0.5));
    }

    function kick(cat, ball) {
      face(cat, ball);
      if (held(ball)) return act(cat, 'jump', 1);          // swat at the ball you're dangling
      const a = Math.atan2(ball.y - cat.y, ball.x - cat.x) + rand(-0.6, 0.6);
      const v = rand(350, 600) * unit();
      ball.vx = Math.cos(a) * v;
      ball.vy = Math.sin(a) * v * 0.6;
      relieve(cat, 'bored', 0.2);
      act(cat, 'attack', 0.5, () => {
        if (cat.needs.bored > 0.25 && !ball.dead && Math.random() < 0.7) use(cat, ball);   // after it again!
      });
    }

    // `hungry`: the cat was hunting for food, so it eats the mouse after.
    function pounce(cat, mouse, hungry = false) {
      face(cat, mouse);
      if (held(mouse) || mouse.dying) return act(cat, 'jump', 1);
      effectAt('pounce', mouse.x, mouse.y - mouse.tall / 2);
      relieve(cat, 'bored', 0.6);
      kill(mouse);
      if (!hungry) {
        say(cat, pick(['Gotcha!', 'Mine!', 'Caught it!']));
        return act(cat, 'attack', 0.8, () => act(cat, cat.def.anim.happy ? 'happy' : 'sit', 1.2));
      }
      act(cat, 'attack', 0.6, () => act(cat, 'sit', 1.6, () => {
        relieve(cat, 'hunger', 0.7);
        emote(cat, '😋');
        say(cat, 'Yum!');
      }));
    }

    // A caught mouse: it squeaks, goes still and fades as the death effect
    // plays, then it's gone.
    const MOUSE_DEATH = 0.9;                             // seconds to fade
    function kill(m) {
      m.dying = MOUSE_DEATH;
      m.vx = m.vy = 0;
      m.sprite.stop();
      m.sprite.tint = 0x9a9aa8;
      say(m, 'Eek!', MOUSE_DEATH);
      effectAt('death', m.x, m.y - m.tall / 2);
    }

    function greet(cat, friend) {
      if (!free(friend)) return act(cat, 'sit', 2);
      settle(friend);
      face(cat, friend);
      face(friend, cat);
      const scrap = Math.random() < 0.5;                   // play-fight, or just sit together
      for (const c of [cat, friend]) {
        relieve(c, 'lonely', 0.7);
        if (scrap) relieve(c, 'bored', 0.3);
        emote(c, scrap ? '💢' : '❤️');
        if (c === cat) say(c, scrap ? 'Hiss!' : 'Mrrp!');
        act(c, scrap ? 'attack' : 'sit', scrap ? 2 : 4);
      }
    }

    function pet(cat) {
      const asleep = cat.anim === 'sleep';
      settle(cat);
      if (asleep) {
        emote(cat, '❗');
        say(cat, 'Hmph!');
        return act(cat, 'jump', 0.8);
      }
      emote(cat, '❤️');
      say(cat, 'Purr~');
      relieve(cat, 'lonely', 0.5);
      relieve(cat, 'bored', 0.2);
      act(cat, cat.def.anim.happy ? 'happy' : 'jump', 1.5);
    }

    function updateCat(cat, dt) {
      for (const k in NEED_RATE) cat.needs[k] = Math.min(1, cat.needs[k] + NEED_RATE[k] * dt);
      chatter(cat, dt);
      cat.time -= dt;

      if (cat.mode === 'act') {
        cat.tick?.(dt);
        if (cat.time > 0) return;
      } else if (cat.mode === 'move') {
        const t = cat.follow;
        if (t?.dead || (t && held(t)) || cat.time <= 0) return think(cat);   // target gone, or gave up
        if (moveCat(cat, t ? t.x : cat.tx, t ? t.y : cat.ty, t ? t.half + cat.half * 0.6 : 0, dt)) return;
        if (!t) { cat.x = cat.tx; cat.y = cat.ty; }
      }
      // Done: run the follow-up, or work out what to do next.
      const next = cat.next;
      cat.mode = cat.next = cat.tick = null;
      next?.();
      if (!cat.mode) think(cat);
    }

    // One step towards (tx, ty), stopping `reach` short. The cat speeds up,
    // turns and brakes smoothly rather than snapping to full speed. Returns
    // false once it has arrived.
    function moveCat(cat, tx, ty, reach, dt) {
      const u = unit();
      const dx = tx - cat.x, dy = ty - cat.y, dist = Math.hypot(dx, dy);
      const left = dist - reach;
      if (left <= 3 * u) { cat.vx = cat.vy = 0; return false; }

      if (cat.follow?.kind === 'mouse') {
        if (!cat.leaping && left < LEAP * u) {                                // pounce from a distance
          Object.assign(cat, { leaping: true, rush: 2.6 });
          play(cat, 'jump');
        } else if (cat.leaping && left > LEAP * 2 * u) {                      // missed: back to running
          Object.assign(cat, { leaping: false, rush: 1.25 });
          play(cat, 'run');
        }
      }
      const top = cat.speed * cat.rush * u;
      const want = Math.min(top, Math.sqrt(2 * ACCEL * u * left));            // brake in time to stop
      const k = Math.min(1, TURN * dt);
      cat.vx += ((dx / dist) * want - cat.vx) * k;
      cat.vy += ((dy / dist) * want - cat.vy) * k;
      const step = Math.hypot(cat.vx, cat.vy) * dt;
      if (step >= left) {
        cat.x += (dx / dist) * left;
        cat.y += (dy / dist) * left;
        cat.vx = cat.vy = 0;
        return false;
      }
      cat.x += cat.vx * dt;
      cat.y += cat.vy * dt;
      if (Math.abs(cat.vx) > 8 * u) cat.dir = Math.sign(cat.vx);
      if (cat.anim === 'run') {                                               // legs keep pace with the floor
        cat.sprite.animationSpeed = ANIM_SPEED.run * clampTo(Math.hypot(cat.vx, cat.vy) / (300 * u), 0.5, 1.8);
      }
      return true;
    }

    // ------------------------------------------------------------------
    // Objects that move on their own
    // ------------------------------------------------------------------
    function fling(e, speed) {
      const a = rand(0, Math.PI * 2);
      e.vx = Math.cos(a) * speed * unit();
      e.vy = Math.sin(a) * speed * 0.6 * unit();
    }

    // Slide by velocity and bounce off the walls and edges of the floor.
    function slide(e, dt, friction) {
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      const { hp, hq } = clamp(e);
      if (hp || hq) {                                       // flip the velocity across the edge it hit
        const f = floorBox();
        let vp = e.vx / f.rx + e.vy / f.ry, vq = e.vx / f.rx - e.vy / f.ry;
        if (hp && Math.sign(vp) === hp) vp *= -0.8;
        if (hq && Math.sign(vq) === hq) vq *= -0.8;
        e.vx = ((vp + vq) / 2) * f.rx;
        e.vy = ((vp - vq) / 2) * f.ry;
      }
      const f = Math.exp(-friction * dt);
      e.vx *= f;
      e.vy *= f;
      return { hp, hq };
    }

    function updateBall(b, dt) {
      slide(b, dt, 1.2);
      const speed = Math.hypot(b.vx, b.vy);
      b.hop += (dt * speed) / 25;
      b.lift = Math.abs(Math.sin(b.hop)) * Math.min(speed / 12, 24 * unit());
    }

    // The mouse darts about in short dashes with pauses in between. When a
    // cat comes close it bolts, zig-zagging away and steering clear of
    // corners it could be trapped in.
    const MOUSE = { dash: 200, flee: 310, scare: 210 };

    function updateMouse(m, dt) {
      if (m.dying !== undefined) {
        m.dying -= dt;
        m.sprite.alpha = Math.max(0, m.dying / MOUSE_DEATH);
        if (m.dying <= 0) remove(m, true);
        return;
      }
      const u = unit();
      if (m.stun > 0) {
        m.stun -= dt;
        slide(m, dt, 4);
      } else {
        const cat = nearest(m, entities.filter(c => c.kind === 'cat' && c.zone === m.zone && !held(c) && c.sprite.visible && c.anim !== 'sleep'));
        const d = cat ? Math.hypot(m.x - cat.x, m.y - cat.y) : Infinity;
        m.time -= dt;
        let speed = 0;
        if (d < MOUSE.scare * u) {
          if (!m.fleeing || m.time <= 0) {                     // new zig every fraction of a second
            if (!m.fleeing) emote(m, '❗');
            m.fleeing = true;
            m.time = rand(0.15, 0.35);
            m.heading = escapeHeading(m, cat);
          }
          speed = MOUSE.flee;
        } else {
          m.fleeing = false;
          if (m.time <= 0) {
            m.dashing = !m.dashing;
            m.time = m.dashing ? rand(0.3, 0.9) : rand(0.25, 1.2);
            if (m.dashing) m.heading = (m.heading ?? rand(0, Math.PI * 2)) + rand(-1.3, 1.3);
          }
          if (m.dashing) speed = MOUSE.dash;
        }
        const k = Math.min(1, 14 * dt);                        // quick to start and stop
        m.vx += (Math.cos(m.heading ?? 0) * speed * u - m.vx) * k;
        m.vy += (Math.sin(m.heading ?? 0) * speed * 0.6 * u - m.vy) * k;
        const { hp, hq } = slide(m, dt, 0);
        if (hp || hq) m.heading = Math.atan2(m.vy / 0.6, m.vx);   // carry on the way it bounced
      }
      const speed = Math.hypot(m.vx, m.vy);
      if (speed > 5) {
        if (!m.sprite.playing) m.sprite.play();
        m.sprite.animationSpeed = 0.25 * clampTo(speed / (200 * u), 0.6, 1.8);
      } else if (m.sprite.playing) m.sprite.stop();
      if (Math.abs(m.vx) > 5) m.dir = Math.sign(m.vx);
    }

    // Away from the cat, but not into a wall: try headings around "straight
    // away" and keep the one with the most open floor ahead.
    function escapeHeading(m, cat) {
      const f = floorBox(), u = unit();
      const away = Math.atan2((m.y - cat.y) / 0.6, m.x - cat.x);
      let best = away, bestScore = -Infinity;
      for (let i = -4; i <= 4; i++) {
        const a = away + i * 0.4 + rand(-0.15, 0.15);
        const [p, q] = toFloor(f, m.x + Math.cos(a) * 110 * u, m.y + Math.sin(a) * 0.6 * 110 * u);
        const out = Math.max(Math.abs(p), Math.abs(q));
        const score = Math.cos(a - away) - Math.max(0, out - 0.8) * 8;
        if (score > bestScore) { best = a; bestScore = score; }
      }
      return best;
    }

    function updateWand(w, dt) {
      w.wiggle -= dt;
      const busy = w.wiggle > 0 || w.user?.mode === 'act';
      if (busy !== w.sprite.playing) busy ? w.sprite.play() : w.sprite.gotoAndStop(0);
    }

    const UPDATE = { cat: updateCat, ball: updateBall, mouse: updateMouse, wand: updateWand };

    // ------------------------------------------------------------------
    // Clicking things
    // ------------------------------------------------------------------
    const CLICK = {
      bowl: b => { setFood(b, 3); emote(b, '✨'); },                            // refill
      bag: () => entities.filter(e => e.kind === 'bowl').forEach(CLICK.bowl),  // refill every bowl
      ball: b => fling(b, 550),
      mouse: m => { if (m.dying) return; fling(m, 260); m.time = 1; emote(m, '❗'); say(m, 'Squeak!'); },
      wand: w => { w.wiggle = 2; },
    };

    function clickItem(item) {
      if (item.kind === 'hideout' && item.user && !item.user.sprite.visible) return pet(item.user);   // knock knock
      CLICK[item.kind]?.(item);
      // …and the nearest cat that isn't busy comes over to check it out.
      const cat = usable(item) && nearest(item, entities.filter(c => free(c) && c.zone === item.zone));
      if (cat) use(cat, item);
    }

    // ------------------------------------------------------------------
    // Drag & drop – from the control bar into the scene, around the scene,
    // and onto the trash. One pointer at a time; a press that doesn't move
    // counts as a click.
    // ------------------------------------------------------------------
    let drag = null;
    let dragMoved = false;          // lets a bar button ignore the click that ends a drag
    const held = e => !!drag?.moved && drag.e === e && !e.fixed;
    const tmp = new PIXI.Point();
    const toWorld = (clientX, clientY) => {
      app.renderer.events.mapPositionToPoint(tmp, clientX, clientY);
      return { x: tmp.x, y: tmp.y };
    };

    function startDrag(target, ev) {
      if (drag || ev.button !== 0) return;
      if (target.e?.dying) return;
      drag = { ...target, id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, moved: false };
      dragMoved = false;
      addEventListener('pointermove', onDragMove);
      addEventListener('pointerup', endDrag);
      addEventListener('pointercancel', endDrag);
    }

    function pickUp() {
      const { e, def } = drag;
      document.body.classList.add('dragging');
      if (def) {
        const k = sizeOf(def);
        drag.ghost = thumb(def, k);
        drag.ghost.className = 'ghost';
        drag.gw = def.look.crop[2] * k;
        drag.gh = def.look.crop[3] * k;
        document.body.appendChild(drag.ghost);
        return;
      }
      if (e.fixed) return;                                  // scenery stays put
      const p = toWorld(drag.sx, drag.sy);
      Object.assign(drag, { ox: e.x - p.x, oy: e.y - p.y, homeX: e.x, homeY: e.y, homeZone: e.zone });
      if (e.kind === 'cat') {
        if (e === menuCat) catMenu.hidePopover();
        settle(e);
        e.mode = null;
        play(e, 'jump');
        e.sprite.gotoAndStop(3);                            // mid-leap: legs dangling
      } else {
        if (e.user) think(e.user);
        e.vx = e.vy = 0;
      }
    }

    function onDragMove(ev) {
      if (ev.pointerId !== drag.id) return;
      if (!drag.moved) {
        if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 6) return;
        drag.moved = dragMoved = true;
        pickUp();
      }
      if (drag.e) {
        if (drag.e.fixed) return;
        const p = toWorld(ev.clientX, ev.clientY);
        if (drag.e.kind === 'cat') drag.e.zone = zoneAt(p);
        drag.e.x = p.x + drag.ox;
        drag.e.y = p.y + drag.oy;
        clamp(drag.e);
        const binning = isOver(trashEl, ev);
        trashEl.classList.toggle('armed', binning);
        binning ? hideDrop() : markDrop(drag.e.x, drag.e.y, drag.e.half);
      } else {
        drag.ghost.style.transform = `translate(${ev.clientX - drag.gw / 2}px, ${ev.clientY - drag.gh}px)`;
        if (!isOver(sceneEl, ev)) return hideDrop();
